openapi: 3.0.3
info:
  title: Hack-in-a-Box API
  version: 0.2.0
  description: |
    Same-origin REST API. Person is the shared identity; registration does not
    imply confirmed attendance. Cookies authenticate; resource policies authorize.
    Mutations require CSRF protection. Action retries reuse an Idempotency-Key;
    reusing a key for different content returns 409. Mutable resource actions use
    If-Match with the observed revision and return 409 on stale revisions.
    List endpoints use an exclusive numeric cursor and bounded page size.
security:
  - session: []
paths:
  /healthz:
    get:
      operationId: getHealth
      security: []
      responses:
        '200':
          description: Process is live; no dependency checks.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
        default: { $ref: '#/components/responses/Error' }
  /readyz:
    get:
      operationId: getReady
      security: []
      responses:
        '200':
          description: Required database, schema and storage are ready.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/session:
    get:
      operationId: getSession
      responses:
        '200':
          description: Current authenticated identity and CSRF token.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/logout:
    post:
      operationId: logout
      parameters:
        - { $ref: '#/components/parameters/CSRF' }
      responses:
        '204': { description: Server session invalidated. }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/events/{event_id}/audit:
    parameters:
      - { $ref: '#/components/parameters/EventID' }
    get:
      operationId: listAudit
      parameters:
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: Authorized event audit records.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditPage' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/events/{event_id}/audit/export:
    parameters:
      - { $ref: '#/components/parameters/EventID' }
    get:
      operationId: exportAudit
      description: Bounded JSON export; follow next_cursor to export additional pages.
      parameters:
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: Downloadable authorized audit page.
          headers:
            Content-Disposition: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditPage' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/events/{event_id}/files:
    parameters:
      - { $ref: '#/components/parameters/EventID' }
    post:
      operationId: uploadFile
      description: Bounded base64 upload. Domain resource policies also apply.
      parameters:
        - { $ref: '#/components/parameters/CSRF' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/Revision' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [filename, media_type, content]
              properties:
                filename: { type: string, minLength: 1, maxLength: 160 }
                media_type: { type: string, enum: [application/pdf, image/png, image/jpeg, text/plain] }
                content: { type: string, format: byte }
      responses:
        '201':
          description: Uploaded file, or the original result for an identical retry.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/File' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/events/{event_id}/files/{file_id}:
    parameters:
      - { $ref: '#/components/parameters/EventID' }
      - name: file_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: downloadFile
      responses:
        '200':
          description: Authorized attachment; never a public filesystem URL.
          headers:
            Content-Disposition: { schema: { type: string } }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        default: { $ref: '#/components/responses/Error' }
components:
  securitySchemes:
    session: { type: apiKey, in: cookie, name: hackbox_session }
  parameters:
    EventID:
      name: event_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    CSRF:
      name: X-CSRF-Token
      in: header
      required: true
      schema: { type: string, minLength: 32, maxLength: 128 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, format: uuid }
    Revision:
      name: If-Match
      in: header
      required: true
      description: Quoted event revision, for example "1".
      schema: { type: string, pattern: '^"[1-9][0-9]*"$' }
    Cursor:
      name: cursor
      in: query
      schema: { type: integer, format: int64, minimum: 0, default: 0 }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
  responses:
    Error:
      description: |
        400 invalid_request; 401 unauthenticated; 403 forbidden or csrf_invalid;
        404 not_found; 409 revision_conflict or idempotency_conflict;
        413 body_too_large or quota_exceeded; 415 unsupported_media;
        500 internal_error; 503 unavailable or object_missing.
        Messages are safe for display. Application policy enforces authorization.
      headers:
        X-Request-ID: { schema: { type: string } }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [ok] }
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, request_id]
          properties:
            code: { type: string }
            message: { type: string }
            request_id: { type: string }
    Session:
      type: object
      required: [person, csrf_token]
      properties:
        person:
          type: object
          required: [id, display_name, platform_admin]
          properties:
            id: { type: string, format: uuid }
            display_name: { type: string }
            platform_admin: { type: boolean }
        csrf_token: { type: string }
    AuditEvent:
      type: object
      required: [id, sequence, action, target_id, reason_code, occurred_at, metadata]
      properties:
        id: { type: string, format: uuid }
        sequence: { type: integer, format: int64 }
        actor_id: { type: string, format: uuid }
        action: { type: string }
        target_id: { type: string, format: uuid }
        reason_code: { type: string }
        occurred_at: { type: string, format: date-time }
        metadata:
          type: object
          additionalProperties: false
          properties:
            reference_id: { type: string, format: uuid }
            previous_revision: { type: integer, format: int64 }
            revision: { type: integer, format: int64 }
            count: { type: integer }
    AuditPage:
      type: object
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/AuditEvent' } }
        next_cursor: { type: integer, format: int64 }
    File:
      type: object
      required: [id, event_id, owner_id, filename, media_type, checksum, size_bytes, created_at]
      properties:
        id: { type: string, format: uuid }
        event_id: { type: string, format: uuid }
        owner_id: { type: string, format: uuid }
        filename: { type: string }
        media_type: { type: string }
        checksum: { type: string }
        size_bytes: { type: integer, format: int64 }
        created_at: { type: string, format: date-time }
