        - {name: channel, in: query, schema: {type: string, enum: [smtp, teams, in_app]}}
        - {name: before_at, in: query, schema: {type: string, format: date-time}}
        - {name: before_id, in: query, schema: {type: string, format: uuid}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}
      responses:
        '200':
          description: Safe retained selection and provider evidence. External acceptance is not confirmed delivery.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DeliveryHistoryPage'}
        default: {$ref: '#/components/responses/Error'}
