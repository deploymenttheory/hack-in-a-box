openapi: 3.0.3
info:
  title: Hack-in-a-Box API
  version: 0.2.0
  description: |
    Same-origin REST API. Person is the shared identity; registration does not
    imply confirmed attendance. Cookies authenticate; resource policies authorize.
    Mutations require CSRF protection. Action retries reuse an Idempotency-Key;
    reusing a key for different content returns 409. Mutable resource actions use
    If-Match with the observed revision and return 409 on stale revisions.
    List endpoints use an exclusive numeric cursor and bounded page size.
security:
  - session: []
paths:
  /healthz:
    get:
      operationId: getHealth
      security: []
      responses:
        '200':
          description: Process is live; no dependency checks.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
        default: { $ref: '#/components/responses/Error' }
  /readyz:
    get:
      operationId: getReady
      security: []
      responses:
        '200':
          description: Required database, schema and storage are ready.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/session:
    get:
      operationId: getSession
      responses:
        '200':
          description: Current authenticated identity and CSRF token.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/logout:
    post:
      operationId: logout
      parameters:
        - { $ref: '#/components/parameters/CSRF' }
      responses:
        '204': { description: Server session invalidated. }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/events/{event_id}/audit:
    parameters:
      - { $ref: '#/components/parameters/EventID' }
    get:
      operationId: listAudit
      parameters:
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: Authorized event audit records.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditPage' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/events/{event_id}/audit/export:
    parameters:
      - { $ref: '#/components/parameters/EventID' }
    get:
      operationId: exportAudit
      description: Bounded JSON export; follow next_cursor to export additional pages.
      parameters:
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: Downloadable authorized audit page.
          headers:
            Content-Disposition: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditPage' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/events/{event_id}/files:
    parameters:
      - { $ref: '#/components/parameters/EventID' }
    post:
      operationId: uploadFile
      description: Bounded base64 upload. Domain resource policies also apply.
      parameters:
        - { $ref: '#/components/parameters/CSRF' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/Revision' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [filename, media_type, content]
              properties:
                filename: { type: string, minLength: 1, maxLength: 160 }
                media_type: { type: string, enum: [application/pdf, image/png, image/jpeg, text/plain] }
                content: { type: string, format: byte }
      responses:
        '201':
          description: Uploaded file, or the original result for an identical retry.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/File' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/events/{event_id}/files/{file_id}:
    parameters:
      - { $ref: '#/components/parameters/EventID' }
      - name: file_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: downloadFile
      responses:
        '200':
          description: Authorized attachment; never a public filesystem URL.
          headers:
            Content-Disposition: { schema: { type: string } }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/events/{event_id}/staff:
    parameters:
      - { $ref: '#/components/parameters/EventID' }
    get:
      operationId: listStaff
      responses:
        '200':
          description: Current and revoked event grants with assignment timestamps.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StaffPage' }
        default: { $ref: '#/components/responses/Error' }
    put:
      operationId: changeStaff
      parameters:
        - { $ref: '#/components/parameters/CSRF' }
        - { $ref: '#/components/parameters/Revision' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StaffChange' }
      responses:
        '200':
          description: Grant saved; current event revision.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RevisionResult' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/events/{event_id}/owner:
    parameters:
      - { $ref: '#/components/parameters/EventID' }
    put:
      operationId: transferOwner
      parameters:
        - { $ref: '#/components/parameters/CSRF' }
        - { $ref: '#/components/parameters/Revision' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [person_id, acknowledge_competition_restriction]
              properties:
                person_id: { type: string, format: uuid }
                acknowledge_competition_restriction: { type: boolean }
      responses:
        '200':
          description: Ownership transferred; current event revision.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RevisionResult' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/events:
    get:
      operationId: listEvents
      parameters:
        - name: after
          in: query
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Authorized event operation result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventPage'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: createEvent
      parameters:
        - $ref: '#/components/parameters/CSRF'
      responses:
        '200':
          description: Authorized event operation result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        default:
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventInput'
  /api/v1/events/{event_id}:
    parameters:
      - $ref: '#/components/parameters/EventID'
    get:
      operationId: getEvent
      parameters: []
      responses:
        '200':
          description: Authorized event operation result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        default:
          $ref: '#/components/responses/Error'
    put:
      operationId: updateEvent
      parameters:
        - $ref: '#/components/parameters/CSRF'
        - $ref: '#/components/parameters/Revision'
      responses:
        '200':
          description: Authorized event operation result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        default:
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventInput'
  /api/v1/events/{event_id}/transition:
    parameters:
      - $ref: '#/components/parameters/EventID'
    post:
      operationId: transitionEvent
      parameters:
        - $ref: '#/components/parameters/CSRF'
        - $ref: '#/components/parameters/Revision'
      responses:
        '200':
          description: Authorized event operation result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        default:
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - stage
                - reason
                - attendance_exception
              properties:
                stage:
                  type: string
                  enum:
                    - registration
                    - preparation
                    - live
                    - assessment
                    - completed
                    - cancelled
                    - archived
                reason:
                  type: string
                  maxLength: 2000
                attendance_exception:
                  type: boolean
  /api/v1/events/{event_id}/schedule:
    parameters:
      - $ref: '#/components/parameters/EventID'
    get:
      operationId: getEventSchedule
      parameters: []
      responses:
        '200':
          description: Authorized event operation result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulePage'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/events/{event_id}/schedule/{item_id}/approve:
    parameters:
      - $ref: '#/components/parameters/EventID'
      - name: item_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: approveEventSchedule
      parameters:
        - $ref: '#/components/parameters/CSRF'
        - $ref: '#/components/parameters/Revision'
      responses:
        '200':
          description: Authorized event operation result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulePage'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/events/{event_id}/decisions:
    parameters:
      - $ref: '#/components/parameters/EventID'
    get:
      operationId: listEventDecisions
      parameters: []
      responses:
        '200':
          description: Authorized event operation result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventDecisionPage'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/event-preview:
    post:
      operationId: previewEvent
      parameters:
        - $ref: '#/components/parameters/CSRF'
      responses:
        '200':
          description: Authorized event operation result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventPreview'
        default:
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventInput'
  /api/v1/time/resolve:
    post:
      operationId: resolveEventTime
      parameters:
        - $ref: '#/components/parameters/CSRF'
      responses:
        '200':
          description: Authorized event operation result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResolvedTime'
        default:
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - wall_time
                - timezone
                - dst_choice
              properties:
                wall_time:
                  type: string
                timezone:
                  type: string
                dst_choice:
                  type: string
                  enum:
                    - ''
                    - earlier
                    - later
  /api/v1/events/{event_id}/privacy:
    parameters:
      - $ref: '#/components/parameters/EventID'
    get:
      operationId: getPrivacySettings
      parameters: []
      responses:
        '200':
          description: Authorized operation result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrivacySettings'
        default:
          $ref: '#/components/responses/Error'
    put:
      operationId: setPrivacySettings
      parameters:
        - $ref: '#/components/parameters/CSRF'
        - $ref: '#/components/parameters/Revision'
      responses:
        '200':
          description: Authorized operation result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrivacySettings'
        default:
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PrivacySettings'
  /api/v1/events/{event_id}/profiles/{person_id}:
    parameters:
      - $ref: '#/components/parameters/EventID'
      - name: person_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getOperationalProfile
      parameters: []
      responses:
        '200':
          description: Authorized operation result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationalProfile'
        default:
          $ref: '#/components/responses/Error'
    put:
      operationId: correctOperationalProfile
      parameters:
        - $ref: '#/components/parameters/CSRF'
        - $ref: '#/components/parameters/ProfileRevision'
      responses:
        '200':
          description: Authorized operation result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationalProfile'
        default:
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileFields'
    delete:
      operationId: deleteOperationalProfile
      parameters:
        - $ref: '#/components/parameters/CSRF'
      responses:
        '200':
          description: Authorized operation result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RemovedResult'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/events/{event_id}/profiles/export:
    parameters:
      - $ref: '#/components/parameters/EventID'
    get:
      operationId: exportOperationalProfiles
      parameters:
        - name: after
          in: query
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Authorized operation result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfilePage'
          headers:
            Content-Disposition:
              schema:
                type: string
        default:
          $ref: '#/components/responses/Error'
  /api/v1/events/{event_id}/registration/forms:
    parameters:
      - $ref: '#/components/parameters/EventID'
    get:
      operationId: listRegistrationForms
      responses:
        '200':
          description: Editable form drafts and their publication versions.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/RegistrationForm'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/events/{event_id}/registration/forms/preview:
    parameters:
      - $ref: '#/components/parameters/EventID'
    post:
      operationId: previewRegistrationForm
      parameters:
        - $ref: '#/components/parameters/CSRF'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [definition, answers]
              properties:
                definition:
                  $ref: '#/components/schemas/TemplateForm'
                answers:
                  $ref: '#/components/schemas/FormAnswers'
      responses:
        '200':
          description: Authoritative visibility and validation; preview answers are not persisted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FormCheck'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/events/{event_id}/registration/forms/{form_id}:
    parameters:
      - $ref: '#/components/parameters/EventID'
      - name: form_id
        in: path
        required: true
        schema: {type: string, format: uuid}
    put:
      operationId: saveRegistrationForm
      parameters:
        - $ref: '#/components/parameters/CSRF'
        - $ref: '#/components/parameters/ProfileRevision'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TemplateForm'
      responses:
        '200':
          description: New immutable form draft version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationForm'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/events/{event_id}/registration/forms/{form_id}/publish:
    parameters:
      - $ref: '#/components/parameters/EventID'
      - name: form_id
        in: path
        required: true
        schema: {type: string, format: uuid}
    post:
      operationId: publishRegistrationForm
      parameters:
        - $ref: '#/components/parameters/CSRF'
        - $ref: '#/components/parameters/ProfileRevision'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [version, acknowledge_response_versions]
              properties:
                version: {type: integer, minimum: 1, maximum: 1000}
                acknowledge_response_versions: {type: boolean}
      responses:
        '200':
          description: Explicitly published form version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationForm'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/registration/events:
    get:
      operationId: discoverRegistrationEvents
      parameters:
        - name: after
          in: query
          schema: {type: string, format: uuid}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 50}
      responses:
        '200':
          description: Authorised registration result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationEventPage'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/registration/events/{event_id}:
    parameters:
      - $ref: '#/components/parameters/EventID'
    get:
      operationId: getRegistrationPage
      responses:
        '200':
          description: Authorised registration result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationPage'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/events/{event_id}/registrations:
    parameters:
      - $ref: '#/components/parameters/EventID'
    post:
      operationId: applyForEvent
      parameters:
        - $ref: '#/components/parameters/CSRF'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplicationInput'
      responses:
        '200':
          description: Authorised registration result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Registration'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/events/{event_id}/registrations/mine:
    parameters:
      - $ref: '#/components/parameters/EventID'
    get:
      operationId: listOwnRegistrations
      responses:
        '200':
          description: Authorised registration result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationList'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/events/{event_id}/registrations/{registration_id}/promote:
    parameters:
      - $ref: '#/components/parameters/EventID'
      - name: registration_id
        in: path
        required: true
        schema: {type: string, format: uuid}
    post:
      operationId: promoteRegistration
      parameters:
        - $ref: '#/components/parameters/CSRF'
        - $ref: '#/components/parameters/Revision'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties:
                reason: {type: string, minLength: 1, maxLength: 2000}
      responses:
        '200':
          description: Authorised registration result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Registration'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/template-starters:
    get:
      operationId: listTemplateStarters
      responses:
        '200':
          description: Sanitized starter definitions for authorised event creators.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/TemplateStarter'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/templates:
    get:
      operationId: listTemplates
      parameters:
        - name: after
          in: query
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 25
      responses:
        '200':
          description: Authorized operation result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplatePage'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: createTemplate
      parameters:
        - $ref: '#/components/parameters/CSRF'
      responses:
        '200':
          description: Authorized operation result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Template'
        default:
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TemplateInput'
  /api/v1/templates/{template_id}:
    parameters:
      - name: template_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getTemplate
      parameters:
        - name: version
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 1000
      responses:
        '200':
          description: Authorized operation result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Template'
        default:
          $ref: '#/components/responses/Error'
    put:
      operationId: editTemplate
      parameters:
        - $ref: '#/components/parameters/CSRF'
        - $ref: '#/components/parameters/Revision'
      responses:
        '200':
          description: Authorized operation result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Template'
        default:
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TemplateInput'
  /api/v1/templates/{template_id}/publish:
    parameters:
      - name: template_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: publishTemplate
      parameters:
        - $ref: '#/components/parameters/CSRF'
        - $ref: '#/components/parameters/Revision'
      responses:
        '200':
          description: Authorized operation result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Template'
        default:
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - version
              properties:
                version:
                  type: integer
                  minimum: 1
                  maximum: 1000
  /api/v1/templates/{template_id}/clone:
    parameters:
      - name: template_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: cloneTemplate
      parameters:
        - $ref: '#/components/parameters/CSRF'
      responses:
        '200':
          description: Authorized operation result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        default:
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CloneInput'
  /api/v1/events/{event_id}/configuration-snapshot:
    parameters:
      - $ref: '#/components/parameters/EventID'
    get:
      operationId: getConfigurationSnapshot
      parameters: []
      responses:
        '200':
          description: Authorized operation result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigurationBundle'
        default:
          $ref: '#/components/responses/Error'
    put:
      operationId: saveEventDefinitions
      parameters:
        - $ref: '#/components/parameters/CSRF'
        - $ref: '#/components/parameters/Revision'
      responses:
        '200':
          description: Authorized operation result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigurationBundle'
        default:
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventDefinitions'
  /api/v1/events/{event_id}/branding:
    parameters:
      - $ref: '#/components/parameters/EventID'
    get:
      operationId: getEventBranding
      responses:
        '200':
          description: Event branding only; excludes private configuration definitions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventBranding'
        default:
          $ref: '#/components/responses/Error'
    put:
      operationId: updateEventBranding
      parameters:
        - $ref: '#/components/parameters/CSRF'
        - $ref: '#/components/parameters/Revision'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TemplateBranding'
      responses:
        '200':
          description: Saved branding and current event revision.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventBranding'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/events/{event_id}/clone:
    parameters:
      - $ref: '#/components/parameters/EventID'
    post:
      operationId: cloneEvent
      parameters:
        - $ref: '#/components/parameters/CSRF'
      responses:
        '200':
          description: Authorized operation result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        default:
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CloneInput'
  /api/v1/account/github:
    get:
      operationId: getGitHubLink
      parameters: []
      responses:
        '200':
          description: Authorized operation result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GitHubLink'
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: unlinkGitHub
      parameters:
        - $ref: '#/components/parameters/CSRF'
        - $ref: '#/components/parameters/ProfileRevision'
      responses:
        '200':
          description: Authorized operation result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GitHubLink'
        default:
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - acknowledge_invitation_impact
              properties:
                acknowledge_invitation_impact:
                  type: boolean
  /api/v1/account/github/authorize:
    post:
      operationId: authorizeGitHub
      parameters:
        - $ref: '#/components/parameters/CSRF'
        - $ref: '#/components/parameters/ProfileRevision'
      responses:
        '200':
          description: Authorized operation result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GitHubAuthorization'
        default:
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - acknowledge_invitation_impact
              properties:
                acknowledge_invitation_impact:
                  type: boolean
components:
  securitySchemes:
    session: { type: apiKey, in: cookie, name: hackbox_session }
  parameters:
    EventID:
      name: event_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    CSRF:
      name: X-CSRF-Token
      in: header
      required: true
      schema: { type: string, minLength: 32, maxLength: 128 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, format: uuid }
    Revision:
      name: If-Match
      in: header
      required: true
      description: Quoted event revision, for example "1".
      schema: { type: string, pattern: '^"[1-9][0-9]*"$' }
    Cursor:
      name: cursor
      in: query
      schema: { type: integer, format: int64, minimum: 0, default: 0 }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
    ProfileRevision:
      name: If-Match
      in: header
      required: true
      description: >-
        Quoted profile revision. Use "0" to create a missing profile; existing profiles require their current
        revision.
      schema:
        type: string
        pattern: ^"[0-9]+"$
  responses:
    Error:
      description: |
        400 invalid_request; 401 unauthenticated; 403 forbidden or csrf_invalid;
        404 not_found; 409 revision_conflict or idempotency_conflict;
        413 body_too_large or quota_exceeded; 415 unsupported_media;
        500 internal_error; 503 unavailable or object_missing.
        Messages are safe for display. Application policy enforces authorization.
      headers:
        X-Request-ID: { schema: { type: string } }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [ok] }
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, request_id]
          properties:
            code: { type: string }
            message: { type: string }
            request_id: { type: string }
            blockers: { type: array, items: { $ref: '#/components/schemas/Blocker' } }
    Session:
      type: object
      required: [person, csrf_token, can_create_events]
      properties:
        person:
          type: object
          required: [id, display_name, platform_admin]
          properties:
            id: { type: string, format: uuid }
            display_name: { type: string }
            platform_admin: { type: boolean }
        csrf_token: { type: string }
        can_create_events: { type: boolean }
    AuditEvent:
      type: object
      required: [id, sequence, action, target_id, reason_code, occurred_at, metadata]
      properties:
        id: { type: string, format: uuid }
        sequence: { type: integer, format: int64 }
        actor_id: { type: string, format: uuid }
        action: { type: string }
        target_id: { type: string, format: uuid }
        reason_code: { type: string }
        occurred_at: { type: string, format: date-time }
        metadata:
          type: object
          additionalProperties: false
          properties:
            reference_id: { type: string, format: uuid }
            previous_revision: { type: integer, format: int64 }
            revision: { type: integer, format: int64 }
            count: { type: integer }
            role: { $ref: '#/components/schemas/StaffRole' }
    AuditPage:
      type: object
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/AuditEvent' } }
        next_cursor: { type: integer, format: int64 }
    File:
      type: object
      required: [id, event_id, owner_id, filename, media_type, checksum, size_bytes, created_at]
      properties:
        id: { type: string, format: uuid }
        event_id: { type: string, format: uuid }
        owner_id: { type: string, format: uuid }
        filename: { type: string }
        media_type: { type: string }
        checksum: { type: string }
        size_bytes: { type: integer, format: int64 }
        created_at: { type: string, format: date-time }
    StaffRole:
      type: string
      enum: [organiser, mentor, judge, mc, logistics, photographer, early_brief_access]
    StaffChange:
      type: object
      additionalProperties: false
      required: [person_id, role, active, acknowledge_competition_restriction]
      properties:
        person_id: { type: string, format: uuid }
        role: { $ref: '#/components/schemas/StaffRole' }
        active: { type: boolean }
        acknowledge_competition_restriction: { type: boolean }
    StaffMember:
      type: object
      required: [person_id, display_name, role, active, changed_at]
      properties:
        person_id: { type: string, format: uuid }
        display_name: { type: string }
        role: { $ref: '#/components/schemas/StaffRole' }
        active: { type: boolean }
        changed_at: { type: string, format: date-time }
    StaffPage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/StaffMember' } }
    RevisionResult:
      type: object
      required: [revision]
      properties:
        revision: { type: integer, format: int64 }

    Calendar:
      type: object
      additionalProperties: false
      required:
        - working_days
        - excluded_dates
      properties:
        working_days:
          type: array
          items:
            type: integer
            minimum: 0
            maximum: 6
          minItems: 1
          maxItems: 7
          uniqueItems: true
        excluded_dates:
          type: array
          items:
            type: string
            format: date
    AgendaItem:
      type: object
      additionalProperties: false
      required:
        - id
        - title
        - audience
        - anchor
        - days
        - minutes
        - business_days
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          minLength: 1
          maxLength: 160
        audience:
          type: array
          items:
            type: string
            enum:
              - all
              - attendee
              - organiser
              - mentor
              - judge
              - mc
              - logistics
              - photographer
        anchor:
          type: string
          enum:
            - live_start
            - submission_cutoff
        days:
          type: integer
          minimum: -3660
          maximum: 3660
        minutes:
          type: integer
          minimum: -1440
          maximum: 1440
        business_days:
          type: boolean
    EventConfiguration:
      type: object
      additionalProperties: false
      required:
        - description
        - timezone
        - venue
        - capacity
        - minimum_attendance
        - live_start
        - live_end
        - admission_cutoff
        - team_freeze
        - submission_cutoff
        - dst_choice
        - calendar
        - schedule
