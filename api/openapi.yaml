      - name: asset_id
        in: path
        required: true
        schema: {type: string, format: uuid}
    get:
      operationId: getDisplayAsset
      security: [{display: []}]
      description: Display capability only. Reads a currently approved validated PNG/JPEG branding asset belonging to this event. No upload/file reader, person-cookie authority or URL credentials. Rechecks pairing and issuer authority on every request; removed assets are unavailable.
      responses:
        '200':
          description: Current approved branding image, never cached.
          content:
            image/png:
              schema: {type: string, format: binary}
            image/jpeg:
              schema: {type: string, format: binary}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/events/{event_id}/display/stream:
    parameters:
      - $ref: '#/components/parameters/EventID'
    get:
      operationId: streamDisplay
      security: [{display: []}]
      description: |
        Authenticated fetch streaming with Authorization Bearer; native EventSource cannot set this header and must not use a URL token. No person cookies or URL query parameters are accepted as credentials. Sends event snapshot with id equal to the current cue revision immediately and every second, containing server_now and server-derived timer values. Last-Event-ID is accepted but never replays historical cues: reconnect always starts from the latest complete snapshot. Clients replace their snapshot on every message, even when a timer update retains the same cue revision. Event revoked closes the stream after pairing/issuer authority is lost; event reconnect closes on temporary dependency failure. Streams are bounded to five minutes with per-query/write deadlines; reconnect using the same still-valid header token.
      parameters:
        - {name: Last-Event-ID, in: header, schema: {type: string, maxLength: 100}}
      responses:
        '200':
          description: Server-sent current snapshots; no stale cue replay.
          content:
            text/event-stream:
              schema: {type: string, format: binary}
        default: {$ref: '#/components/responses/Error'}
