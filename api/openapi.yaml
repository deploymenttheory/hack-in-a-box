openapi: 3.0.3
info:
  title: Hack-in-a-Box API
  version: 0.2.0
  description: |
    Same-origin REST API. Person is the shared identity; registration does not
    imply confirmed attendance. Cookies authenticate; resource policies authorize.
    Mutations require CSRF protection. Action retries reuse an Idempotency-Key;
    reusing a key for different content returns 409. Mutable resource actions use
    If-Match with the observed revision and return 409 on stale revisions.
    List endpoints use an exclusive numeric cursor and bounded page size.
security:
  - session: []
paths:
  /healthz:
    get:
      operationId: getHealth
      security: []
      responses:
        '200':
          description: Process is live; no dependency checks.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
        default: { $ref: '#/components/responses/Error' }
  /readyz:
    get:
      operationId: getReady
      security: []
      responses:
        '200':
          description: Required database, schema and storage are ready.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/session:
    get:
      operationId: getSession
      responses:
        '200':
          description: Current authenticated identity and CSRF token.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/logout:
    post:
      operationId: logout
      parameters:
        - { $ref: '#/components/parameters/CSRF' }
      responses:
        '204': { description: Server session invalidated. }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/events/{event_id}/audit:
    parameters:
      - { $ref: '#/components/parameters/EventID' }
    get:
      operationId: listAudit
      parameters:
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: Authorized event audit records.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditPage' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/events/{event_id}/audit/export:
    parameters:
      - { $ref: '#/components/parameters/EventID' }
    get:
      operationId: exportAudit
      description: Bounded JSON export; follow next_cursor to export additional pages.
      parameters:
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: Downloadable authorized audit page.
          headers:
            Content-Disposition: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditPage' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/events/{event_id}/files:
    parameters:
      - { $ref: '#/components/parameters/EventID' }
    post:
      operationId: uploadFile
      description: Bounded base64 upload. Domain resource policies also apply.
      parameters:
        - { $ref: '#/components/parameters/CSRF' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/Revision' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [filename, media_type, content]
              properties:
                filename: { type: string, minLength: 1, maxLength: 160 }
                media_type: { type: string, enum: [application/pdf, image/png, image/jpeg, text/plain] }
                content: { type: string, format: byte }
      responses:
        '201':
          description: Uploaded file, or the original result for an identical retry.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/File' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/events/{event_id}/files/{file_id}:
    parameters:
      - { $ref: '#/components/parameters/EventID' }
      - name: file_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: downloadFile
      responses:
        '200':
          description: Authorized attachment; never a public filesystem URL.
          headers:
            Content-Disposition: { schema: { type: string } }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/events/{event_id}/staff:
    parameters:
      - { $ref: '#/components/parameters/EventID' }
    get:
      operationId: listStaff
      responses:
        '200':
          description: Current and revoked event grants with assignment timestamps.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StaffPage' }
        default: { $ref: '#/components/responses/Error' }
    put:
      operationId: changeStaff
      parameters:
        - { $ref: '#/components/parameters/CSRF' }
        - { $ref: '#/components/parameters/Revision' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StaffChange' }
      responses:
        '200':
          description: Grant saved; current event revision.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RevisionResult' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/events/{event_id}/owner:
    parameters:
      - { $ref: '#/components/parameters/EventID' }
    put:
      operationId: transferOwner
      parameters:
        - { $ref: '#/components/parameters/CSRF' }
        - { $ref: '#/components/parameters/Revision' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [person_id, acknowledge_competition_restriction]
              properties:
                person_id: { type: string, format: uuid }
                acknowledge_competition_restriction: { type: boolean }
      responses:
        '200':
          description: Ownership transferred; current event revision.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RevisionResult' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/events:
    get:
      operationId: listEvents
      parameters:
        - name: after
          in: query
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Authorized event operation result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventPage'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: createEvent
      parameters:
        - $ref: '#/components/parameters/CSRF'
      responses:
        '200':
          description: Authorized event operation result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        default:
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventInput'
  /api/v1/events/{event_id}:
    parameters:
      - $ref: '#/components/parameters/EventID'
    get:
      operationId: getEvent
      parameters: []
      responses:
        '200':
          description: Authorized event operation result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        default:
          $ref: '#/components/responses/Error'
    put:
      operationId: updateEvent
      parameters:
        - $ref: '#/components/parameters/CSRF'
        - $ref: '#/components/parameters/Revision'
      responses:
        '200':
          description: Authorized event operation result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        default:
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventInput'
  /api/v1/events/{event_id}/transition:
    parameters:
      - $ref: '#/components/parameters/EventID'
    post:
      operationId: transitionEvent
      parameters:
        - $ref: '#/components/parameters/CSRF'
        - $ref: '#/components/parameters/Revision'
      responses:
        '200':
          description: Authorized event operation result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        default:
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - stage
                - reason
                - attendance_exception
              properties:
                stage:
                  type: string
                  enum:
                    - registration
                    - preparation
                    - live
                    - assessment
                    - completed
                    - cancelled
                    - archived
                reason:
                  type: string
                  maxLength: 2000
                attendance_exception:
                  type: boolean
  /api/v1/events/{event_id}/schedule:
    parameters:
      - $ref: '#/components/parameters/EventID'
    get:
      operationId: getEventSchedule
      parameters: []
      responses:
        '200':
          description: Authorized event operation result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulePage'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/events/{event_id}/schedule/{item_id}/approve:
    parameters:
      - $ref: '#/components/parameters/EventID'
      - name: item_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: approveEventSchedule
      parameters:
        - $ref: '#/components/parameters/CSRF'
        - $ref: '#/components/parameters/Revision'
      responses:
        '200':
          description: Authorized event operation result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulePage'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/events/{event_id}/decisions:
    parameters:
      - $ref: '#/components/parameters/EventID'
    get:
      operationId: listEventDecisions
      parameters: []
      responses:
        '200':
          description: Authorized event operation result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventDecisionPage'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/event-preview:
    post:
      operationId: previewEvent
      parameters:
        - $ref: '#/components/parameters/CSRF'
      responses:
        '200':
          description: Authorized event operation result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventPreview'
        default:
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventInput'
  /api/v1/time/resolve:
    post:
      operationId: resolveEventTime
      parameters:
        - $ref: '#/components/parameters/CSRF'
      responses:
        '200':
          description: Authorized event operation result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResolvedTime'
        default:
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - wall_time
                - timezone
                - dst_choice
              properties:
                wall_time:
                  type: string
                timezone:
                  type: string
                dst_choice:
                  type: string
                  enum:
                    - ''
                    - earlier
                    - later
components:
  securitySchemes:
    session: { type: apiKey, in: cookie, name: hackbox_session }
  parameters:
    EventID:
      name: event_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    CSRF:
      name: X-CSRF-Token
      in: header
      required: true
      schema: { type: string, minLength: 32, maxLength: 128 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, format: uuid }
    Revision:
      name: If-Match
      in: header
      required: true
      description: Quoted event revision, for example "1".
      schema: { type: string, pattern: '^"[1-9][0-9]*"$' }
    Cursor:
      name: cursor
      in: query
      schema: { type: integer, format: int64, minimum: 0, default: 0 }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
  responses:
    Error:
      description: |
        400 invalid_request; 401 unauthenticated; 403 forbidden or csrf_invalid;
        404 not_found; 409 revision_conflict or idempotency_conflict;
        413 body_too_large or quota_exceeded; 415 unsupported_media;
        500 internal_error; 503 unavailable or object_missing.
        Messages are safe for display. Application policy enforces authorization.
      headers:
        X-Request-ID: { schema: { type: string } }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [ok] }
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, request_id]
          properties:
            code: { type: string }
            message: { type: string }
            request_id: { type: string }
            blockers: { type: array, items: { $ref: '#/components/schemas/Blocker' } }
    Session:
      type: object
      required: [person, csrf_token]
      properties:
        person:
          type: object
          required: [id, display_name, platform_admin]
          properties:
            id: { type: string, format: uuid }
            display_name: { type: string }
            platform_admin: { type: boolean }
        csrf_token: { type: string }
    AuditEvent:
      type: object
      required: [id, sequence, action, target_id, reason_code, occurred_at, metadata]
      properties:
        id: { type: string, format: uuid }
        sequence: { type: integer, format: int64 }
        actor_id: { type: string, format: uuid }
        action: { type: string }
        target_id: { type: string, format: uuid }
        reason_code: { type: string }
        occurred_at: { type: string, format: date-time }
        metadata:
          type: object
          additionalProperties: false
          properties:
            reference_id: { type: string, format: uuid }
            previous_revision: { type: integer, format: int64 }
            revision: { type: integer, format: int64 }
            count: { type: integer }
            role: { $ref: '#/components/schemas/StaffRole' }
    AuditPage:
      type: object
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/AuditEvent' } }
        next_cursor: { type: integer, format: int64 }
    File:
      type: object
      required: [id, event_id, owner_id, filename, media_type, checksum, size_bytes, created_at]
      properties:
        id: { type: string, format: uuid }
        event_id: { type: string, format: uuid }
        owner_id: { type: string, format: uuid }
        filename: { type: string }
        media_type: { type: string }
        checksum: { type: string }
        size_bytes: { type: integer, format: int64 }
        created_at: { type: string, format: date-time }
    StaffRole:
      type: string
      enum: [organiser, mentor, judge, mc, logistics, photographer, early_brief_access]
    StaffChange:
      type: object
      additionalProperties: false
      required: [person_id, role, active, acknowledge_competition_restriction]
      properties:
        person_id: { type: string, format: uuid }
        role: { $ref: '#/components/schemas/StaffRole' }
        active: { type: boolean }
        acknowledge_competition_restriction: { type: boolean }
    StaffMember:
      type: object
      required: [person_id, display_name, role, active, changed_at]
      properties:
        person_id: { type: string, format: uuid }
        display_name: { type: string }
        role: { $ref: '#/components/schemas/StaffRole' }
        active: { type: boolean }
        changed_at: { type: string, format: date-time }
    StaffPage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/StaffMember' } }
    RevisionResult:
      type: object
      required: [revision]
      properties:
        revision: { type: integer, format: int64 }

    Calendar:
      type: object
      additionalProperties: false
      required:
        - working_days
        - excluded_dates
      properties:
        working_days:
          type: array
          items:
            type: integer
            minimum: 0
            maximum: 6
          minItems: 1
          maxItems: 7
          uniqueItems: true
        excluded_dates:
          type: array
          items:
            type: string
            format: date
    AgendaItem:
      type: object
      additionalProperties: false
      required:
        - id
        - title
        - audience
        - anchor
        - days
        - minutes
        - business_days
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          minLength: 1
          maxLength: 160
        audience:
          type: array
          items:
            type: string
            enum:
              - all
              - attendee
              - organiser
              - mentor
              - judge
              - mc
              - logistics
              - photographer
        anchor:
          type: string
          enum:
            - live_start
            - submission_cutoff
        days:
          type: integer
          minimum: -3660
          maximum: 3660
        minutes:
          type: integer
          minimum: -1440
          maximum: 1440
        business_days:
          type: boolean
    EventConfiguration:
      type: object
      additionalProperties: false
      required:
        - description
        - timezone
        - venue
        - capacity
        - minimum_attendance
        - live_start
        - live_end
        - admission_cutoff
        - team_freeze
        - submission_cutoff
        - dst_choice
        - calendar
        - schedule
      properties:
        description:
          type: string
          maxLength: 4000
        timezone:
          type: string
          minLength: 1
          maxLength: 100
        venue:
          type: string
          maxLength: 500
        capacity:
          type: integer
          minimum: 1
          maximum: 10000
        minimum_attendance:
          type: integer
          minimum: 1
          maximum: 10000
        live_start:
          type: string
          format: date-time
        live_end:
          type: string
          format: date-time
        admission_cutoff:
          type: string
          format: date-time
        team_freeze:
          type: string
          format: date-time
        submission_cutoff:
          type: string
          format: date-time
        dst_choice:
          type: string
          enum:
            - ''
            - earlier
            - later
        calendar:
          $ref: '#/components/schemas/Calendar'
        schedule:
          type: array
          items:
            $ref: '#/components/schemas/AgendaItem'
          maxItems: 200
    EventInput:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - slug
        - configuration
        - acknowledge_competition_restriction
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 160
        slug:
          type: string
          minLength: 1
          maxLength: 100
        configuration:
          $ref: '#/components/schemas/EventConfiguration'
        reason:
          type: string
          maxLength: 2000
        approve_postponement:
          type: boolean
        acknowledge_competition_restriction:
          type: boolean
    Blocker:
      type: object
      additionalProperties: false
      required:
        - field
        - code
        - message
      properties:
        field:
          type: string
        code:
          type: string
        message:
          type: string
    Event:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - slug
        - owner_id
        - revision
        - stage
        - configuration
        - challenge_publication
        - published_at
        - confirmed_attendees
        - blockers
        - can_edit
        - can_manage_owner
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        owner_id:
          type: string
          format: uuid
          nullable: true
        revision:
          type: integer
          format: int64
        stage:
          type: string
          enum:
            - draft
            - registration
            - preparation
            - live
            - assessment
            - completed
            - cancelled
            - archived
        configuration:
          $ref: '#/components/schemas/EventConfiguration'
        challenge_publication:
          type: string
          format: date-time
          nullable: true
        published_at:
          type: string
          format: date-time
          nullable: true
        confirmed_attendees:
          type: integer
          format: int64
        blockers:
          type: array
          items:
            $ref: '#/components/schemas/Blocker'
        can_edit:
          type: boolean
        can_manage_owner:
          type: boolean
    EventPage:
      type: object
      additionalProperties: false
      required:
        - items
        - next_cursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Event'
        next_cursor:
          type: string
          format: uuid
          nullable: true
    ScheduleItem:
      type: object
      additionalProperties: false
      required:
        - item
        - due_at
        - status
        - revision
      properties:
        item:
          $ref: '#/components/schemas/AgendaItem'
        due_at:
          type: string
          format: date-time
        status:
          type: string
          enum:
            - draft
            - approved
            - executed
            - cancelled
            - needs_review
        revision:
          type: integer
          format: int64
    SchedulePage:
      type: object
      additionalProperties: false
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ScheduleItem'
    EventPreview:
      type: object
      additionalProperties: false
      required:
        - blockers
        - challenge_publication
        - schedule
      properties:
        blockers:
          type: array
          items:
            $ref: '#/components/schemas/Blocker'
        challenge_publication:
          type: string
          format: date-time
          nullable: true
        schedule:
          type: array
          items:
            $ref: '#/components/schemas/ScheduleItem'
    EventDecision:
      type: object
      additionalProperties: false
      required:
        - id
        - actor_id
        - kind
        - reason
        - revision
        - created_at
      properties:
        id:
          type: string
          format: uuid
        actor_id:
          type: string
          format: uuid
        kind:
          type: string
        reason:
          type: string
        revision:
          type: integer
          format: int64
        created_at:
          type: string
          format: date-time
    EventDecisionPage:
      type: object
      additionalProperties: false
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/EventDecision'
    ResolvedTime:
      type: object
      additionalProperties: false
      required:
        - instant
      properties:
        instant:
          type: string
          format: date-time
