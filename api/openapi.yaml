components:
  securitySchemes:
    display:
      type: http
      scheme: bearer
      bearerFormat: opaque
    session: { type: apiKey, in: cookie, name: hackbox_session }
  parameters:
    EventID:
      name: event_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    CSRF:
      name: X-CSRF-Token
      in: header
      required: true
      schema: { type: string, minLength: 32, maxLength: 128 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, format: uuid }
    PresentationRevision:
      name: If-Match
      in: header
      required: true
      description: Quoted presentation revision, starting at "0".
      schema: {type: string, pattern: '^"(0|[1-9][0-9]*)"$'}
    Revision:
      name: If-Match
      in: header
      required: true
      description: Quoted event revision, for example "1".
      schema: { type: string, pattern: '^"[1-9][0-9]*"$' }
    Cursor:
      name: cursor
      in: query
      schema: { type: integer, format: int64, minimum: 0, default: 0 }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
    ProfileRevision:
      name: If-Match
      in: header
      required: true
      description: >-
        Quoted profile revision. Use "0" to create a missing profile; existing profiles require their current
        revision.
      schema:
        type: string
        pattern: ^"[0-9]+"$
  responses:
    Error:
      description: |
        400 invalid_request; 401 unauthenticated; 403 forbidden or csrf_invalid;
        404 not_found; 409 revision_conflict or idempotency_conflict;
        413 body_too_large or quota_exceeded; 415 unsupported_media;
        500 internal_error; 503 unavailable or object_missing.
        Messages are safe for display. Application policy enforces authorization.
      headers:
        X-Request-ID: { schema: { type: string } }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
