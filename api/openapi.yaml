      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/ContentNotice'}
    SubmissionOrganiser:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
    SubmissionPage:
      type: object
      additionalProperties: false
      required: [event_revision, revision, entry_id, team_id, outcome, frozen_at, can_draft, can_submit, can_review, live_start, cutoff, definitions, final, can_read_draft, organisers]
      properties:
        can_read_draft: {type: boolean, description: Current confirmed team member may read the private draft. Organisers and reviewers cannot.}
        organisers:
          type: array
          description: Current active organiser display names to contact about an exception. No private contact fields.
          items: {$ref: '#/components/schemas/SubmissionOrganiser'}
        event_revision: {type: integer, format: int64}
        revision: {type: integer, format: int64}
        entry_id: {type: string, format: uuid}
        team_id: {type: string, format: uuid}
        outcome: {type: string, enum: [open, frozen, not_submitted, withdrawn]}
        frozen_at: {type: string, format: date-time, nullable: true}
        can_draft: {type: boolean}
        can_submit: {type: boolean}
        can_review: {type: boolean}
        live_start: {type: string, format: date-time}
        cutoff: {type: string, format: date-time}
        definitions:
          type: array
          description: Competition definitions are withheld until actual common challenge publication for participants. Current organisers retain their authoring view.
          items: {$ref: '#/components/schemas/SubmissionDefinition'}
        final:
          nullable: true
          allOf: [{$ref: '#/components/schemas/SubmissionRevision'}]
    SubmissionChange:
      type: object
      additionalProperties: false
      required: [revision, actor_id, action, active_revision, review_status, reason, at, submission]
