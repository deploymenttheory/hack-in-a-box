          type: string
          maxLength: 4000
        timezone:
          type: string
          minLength: 1
          maxLength: 100
        venue:
          type: string
          maxLength: 500
        capacity:
          type: integer
          minimum: 1
          maximum: 10000
        minimum_attendance:
          type: integer
          minimum: 1
          maximum: 10000
        live_start:
          type: string
          format: date-time
        live_end:
          type: string
          format: date-time
        admission_cutoff:
          type: string
          format: date-time
        team_freeze:
          type: string
          format: date-time
        submission_cutoff:
          type: string
          format: date-time
        dst_choice:
          type: string
          enum:
            - ''
