    DeliveryHistoryItem:
      type: object
      additionalProperties: false
      required: [id, campaign_id, campaign_version, recipient_id, recipient_name, channel, purpose, selected_at, state, reason, attempted, attempts, revision, operation_state, cancelled]
      properties:
        id: {type: string, format: uuid}
        campaign_id: {type: string, format: uuid, nullable: true}
        campaign_version: {type: integer, format: int64, minimum: 0}
        recipient_id: {type: string, format: uuid, nullable: true}
        recipient_name: {type: string}
        channel: {type: string, enum: [smtp, teams, in_app]}
        purpose: {type: string, enum: [campaign, self_test, omission, broadcast, connection_test]}
        selected_at: {type: string, format: date-time}
        state: {type: string, enum: [never_attempted, provider_accepted, retryable, permanent, ambiguous, in_progress, local_persisted, unavailable]}
        reason: {type: string, maxLength: 100}
        attempted: {type: boolean}
        attempts: {type: integer, format: int32, minimum: 0}
        revision: {type: integer, format: int64, minimum: 0}
        operation_state: {type: string, enum: ['', pending, running, delivered, permanent, ambiguous, cancelled]}
        cancelled: {type: boolean}
    DeliveryHistoryCursor:
      type: object
      additionalProperties: false
      required: [at, id]
      properties:
        at: {type: string, format: date-time}
        id: {type: string, format: uuid}
    DeliveryHistoryPage:
      type: object
      additionalProperties: false
      required: [items, next_cursor, archived, paused]
      properties:
        items: {type: array, maxItems: 100, items: {$ref: '#/components/schemas/DeliveryHistoryItem'}}
        next_cursor: {nullable: true, allOf: [{$ref: '#/components/schemas/DeliveryHistoryCursor'}]}
        archived: {type: boolean}
        paused: {type: boolean}
    DeliveryHistoryAttempt:
      type: object
      additionalProperties: false
      required: [id, number, started_at, state, reason, recorded_at, http_status, retry_at]
      properties:
        id: {type: string, format: uuid}
        number: {type: integer, format: int32, minimum: 1}
        started_at: {type: string, format: date-time}
        state: {type: string, enum: [provider_accepted, retryable, permanent, ambiguous]}
        reason: {type: string, maxLength: 100}
        recorded_at: {type: string, format: date-time, nullable: true}
        http_status: {type: integer, format: int32, minimum: 100, maximum: 599, nullable: true}
        retry_at: {type: string, format: date-time, nullable: true}
    DeliveryHistoryReview:
      type: object
      additionalProperties: false
      required: [id, actor_id, action, reason, created_at, expected_revision]
      properties:
        expected_revision: {type: integer, format: int64, minimum: 1}
        id: {type: string, format: uuid}
        actor_id: {type: string, format: uuid}
        action: {type: string, enum: [retry, cancel, cancel_resend, resolve_no_resend, resend_acknowledged]}
        reason: {type: string, minLength: 1, maxLength: 2000}
        created_at: {type: string, format: date-time}
    DeliveryHistoryDetail:
      type: object
      additionalProperties: false
      required: [item, attempts, next_attempt_number, reviews, next_review_id, archived, paused, actions]
      properties:
        actions: {type: array, maxItems: 5, items: {type: string, enum: [retry, cancel, cancel_resend, resolve_no_resend, resend_acknowledged]}}
        item: {$ref: '#/components/schemas/DeliveryHistoryItem'}
        attempts: {type: array, maxItems: 50, items: {$ref: '#/components/schemas/DeliveryHistoryAttempt'}}
        next_attempt_number: {type: integer, format: int32, minimum: 1, nullable: true}
        reviews: {type: array, maxItems: 20, items: {$ref: '#/components/schemas/DeliveryHistoryReview'}}
        next_review_id: {type: string, format: uuid, nullable: true}
        archived: {type: boolean}
        paused: {type: boolean}
