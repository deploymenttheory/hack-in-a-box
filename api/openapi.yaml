openapi: 3.0.3
info:
  title: Hack-in-a-Box API
  version: 0.2.0
  description: |
    Same-origin REST API. Person is the shared identity; registration does not
    imply confirmed attendance. Cookies authenticate person operations; scoped
    Authorization Bearer capabilities authenticate display snapshots, streams and approved branding assets.
    Resource policies authorize.
    Mutations require CSRF protection. Action retries reuse an Idempotency-Key;
    reusing a key for different content returns 409. Mutable resource actions use
    If-Match with the observed revision and return 409 on stale revisions.
    List endpoints use an exclusive numeric cursor and bounded page size.
security:
  - session: []
paths:
  /healthz:
    get:
      operationId: getHealth
      security: []
      responses:
        '200':
          description: Process is live; no dependency checks.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
        default: { $ref: '#/components/responses/Error' }
  /readyz:
    get:
      operationId: getReady
      security: []
      responses:
        '200':
          description: Required database, schema and storage are ready.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/session:
    get:
      operationId: getSession
      responses:
        '200':
          description: Current authenticated identity and CSRF token.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/logout:
    post:
      operationId: logout
      parameters:
        - { $ref: '#/components/parameters/CSRF' }
      responses:
        '204': { description: Server session invalidated. }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/account/email:
    get:
      operationId: getAccountEmail
      responses:
        '200':
          description: Private masked mailbox confirmation status for the current account.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountEmailStatus' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/account/email/verification:
    post:
      operationId: requestEmailVerification
      parameters:
        - { $ref: '#/components/parameters/CSRF' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email]
              properties:
                email: { type: string, minLength: 3, maxLength: 254 }
      responses:
        '202':
          description: Neutral one-use confirmation requested; SMTP acceptance does not prove inbox delivery.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountEmailStatus' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/account/email/confirmation:
    post:
      operationId: confirmAccountEmail
      parameters:
        - { $ref: '#/components/parameters/CSRF' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [code]
              properties:
                code: { type: string, pattern: '^[0-9]{8}$' }
      responses:
        '200':
          description: Current account proved control of its pending mailbox; the code was consumed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountEmailStatus' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/events/{event_id}/audit:
    parameters:
      - { $ref: '#/components/parameters/EventID' }
    get:
      operationId: listAudit
      parameters:
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: Authorized event audit records.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditPage' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/events/{event_id}/audit/export:
    parameters:
      - { $ref: '#/components/parameters/EventID' }
    get:
      operationId: exportAudit
      description: Bounded JSON export; follow next_cursor to export additional pages.
      parameters:
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: Downloadable authorized audit page.
          headers:
            Content-Disposition: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditPage' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/events/{event_id}/files:
    parameters:
      - { $ref: '#/components/parameters/EventID' }
    post:
      operationId: uploadFile
      description: Bounded base64 upload. Domain resource policies also apply.
      parameters:
        - { $ref: '#/components/parameters/CSRF' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/Revision' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [filename, media_type, content]
              properties:
                team_id: { type: string, format: uuid, description: Optional team scope. Requires current published membership or authorised organiser submission work. }
                reason: { type: string, maxLength: 2000, description: Required for organiser team uploads after the shared cutoff. }
                filename: { type: string, minLength: 1, maxLength: 160 }
                media_type: { type: string, enum: [application/pdf, image/png, image/jpeg, text/plain] }
                content: { type: string, format: byte }
      responses:
        '201':
          description: Uploaded file, or the original result for an identical retry.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/File' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/events/{event_id}/files/{file_id}:
    parameters:
      - { $ref: '#/components/parameters/EventID' }
      - name: file_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: downloadFile
      responses:
        '200':
          description: Authorized attachment; never a public filesystem URL.
          headers:
            Content-Disposition: { schema: { type: string } }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/events/{event_id}/staff:
    parameters:
      - { $ref: '#/components/parameters/EventID' }
    get:
      operationId: listStaff
      responses:
        '200':
          description: Current and revoked event grants with assignment timestamps.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StaffPage' }
        default: { $ref: '#/components/responses/Error' }
    put:
      operationId: changeStaff
      parameters:
        - { $ref: '#/components/parameters/CSRF' }
        - { $ref: '#/components/parameters/Revision' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StaffChange' }
      responses:
        '200':
          description: Grant saved; current event revision.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RevisionResult' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/events/{event_id}/owner:
    parameters:
      - { $ref: '#/components/parameters/EventID' }
    put:
      operationId: transferOwner
      parameters:
        - { $ref: '#/components/parameters/CSRF' }
        - { $ref: '#/components/parameters/Revision' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [person_id, acknowledge_competition_restriction]
              properties:
                person_id: { type: string, format: uuid }
                acknowledge_competition_restriction: { type: boolean }
      responses:
        '200':
          description: Ownership transferred; current event revision.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RevisionResult' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/inbox:
    get:
      operationId: getInbox
      parameters:
        - name: event_id
          in: query
          schema: {type: string, format: uuid}
        - name: cursor
          in: query
          schema: {type: string, format: uuid}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 30}
      responses:
        '200':
          description: Recipient-only current-authority filtered previews and unread count. Hidden resources never contribute to counts or cursors.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/InboxPage'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/inbox/{notification_id}:
    parameters:
      - name: notification_id
        in: path
        required: true
        schema: {type: string, format: uuid}
    get:
      operationId: getInboxNotification
      responses:
        '200':
          description: Immutable delivered body after current source audience and resource authorization.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/InboxDetail'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/inbox/{notification_id}/read:
    parameters:
      - name: notification_id
        in: path
        required: true
        schema: {type: string, format: uuid}
    post:
      operationId: setInboxRead
      parameters:
        - $ref: '#/components/parameters/CSRF'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [read]
              properties:
                read: {type: boolean}
      responses:
        '200':
          description: Recipient read state updated only after current source authorization.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/InboxDetail'}
        default: {$ref: '#/components/responses/Error'}

  /api/v1/events:
    get:
      operationId: listEvents
      parameters:
        - name: after
          in: query
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Authorized event operation result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventPage'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: createEvent
      parameters:
        - $ref: '#/components/parameters/CSRF'
      responses:
        '200':
          description: Authorized event operation result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        default:
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventInput'
  /api/v1/events/{event_id}:
    parameters:
      - $ref: '#/components/parameters/EventID'
    get:
      operationId: getEvent
      parameters: []
      responses:
        '200':
          description: Authorized event operation result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        default:
          $ref: '#/components/responses/Error'
    put:
      operationId: updateEvent
      parameters:
        - $ref: '#/components/parameters/CSRF'
        - $ref: '#/components/parameters/Revision'
      responses:
        '200':
          description: Authorized event operation result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        default:
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventInput'
  /api/v1/events/{event_id}/transition:
    parameters:
      - $ref: '#/components/parameters/EventID'
    post:
      operationId: transitionEvent
      parameters:
        - $ref: '#/components/parameters/CSRF'
        - $ref: '#/components/parameters/Revision'
      responses:
        '200':
          description: Authorized event operation result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        default:
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - stage
                - reason
                - attendance_exception
              properties:
                stage:
                  type: string
                  enum:
                    - registration
                    - preparation
                    - live
                    - assessment
                    - completed
                    - cancelled
                    - archived
                reason:
                  type: string
                  maxLength: 2000
                attendance_exception:
                  type: boolean
  /api/v1/events/{event_id}/schedule:
    parameters:
      - $ref: '#/components/parameters/EventID'
    get:
      operationId: getEventSchedule
      parameters: []
      responses:
        '200':
          description: Authorized event operation result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulePage'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/events/{event_id}/schedule/{item_id}/approve:
    parameters:
      - $ref: '#/components/parameters/EventID'
      - name: item_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: approveEventSchedule
      parameters:
        - $ref: '#/components/parameters/CSRF'
        - $ref: '#/components/parameters/Revision'
      responses:
        '200':
          description: Authorized event operation result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulePage'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/events/{event_id}/decisions:
    parameters:
      - $ref: '#/components/parameters/EventID'
    get:
      operationId: listEventDecisions
      parameters: []
      responses:
        '200':
          description: Authorized event operation result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventDecisionPage'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/event-preview:
    post:
      operationId: previewEvent
      parameters:
        - $ref: '#/components/parameters/CSRF'
      responses:
        '200':
          description: Authorized event operation result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventPreview'
        default:
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventInput'
  /api/v1/time/resolve:
    post:
      operationId: resolveEventTime
      parameters:
        - $ref: '#/components/parameters/CSRF'
      responses:
        '200':
          description: Authorized event operation result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResolvedTime'
        default:
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - wall_time
                - timezone
                - dst_choice
              properties:
                wall_time:
                  type: string
                timezone:
                  type: string
                dst_choice:
                  type: string
                  enum:
                    - ''
                    - earlier
                    - later
  /api/v1/events/{event_id}/privacy:
    parameters:
      - $ref: '#/components/parameters/EventID'
    get:
      operationId: getPrivacySettings
      parameters: []
      responses:
        '200':
          description: Authorized operation result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrivacySettings'
        default:
          $ref: '#/components/responses/Error'
    put:
      operationId: setPrivacySettings
      parameters:
        - $ref: '#/components/parameters/CSRF'
        - $ref: '#/components/parameters/Revision'
      responses:
        '200':
          description: Authorized operation result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrivacySettings'
        default:
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PrivacySettings'
  /api/v1/events/{event_id}/profiles/{person_id}:
    parameters:
      - $ref: '#/components/parameters/EventID'
      - name: person_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getOperationalProfile
      parameters: []
      responses:
        '200':
          description: Authorized operation result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationalProfile'
        default:
          $ref: '#/components/responses/Error'
    put:
      operationId: correctOperationalProfile
      parameters:
        - $ref: '#/components/parameters/CSRF'
        - $ref: '#/components/parameters/ProfileRevision'
      responses:
        '200':
          description: Authorized operation result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationalProfile'
        default:
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileFields'
    delete:
      operationId: deleteOperationalProfile
      parameters:
        - $ref: '#/components/parameters/CSRF'
      responses:
        '200':
          description: Authorized operation result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RemovedResult'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/events/{event_id}/profiles/export:
    parameters:
      - $ref: '#/components/parameters/EventID'
    get:
      operationId: exportOperationalProfiles
      parameters:
        - name: after
          in: query
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Authorized operation result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfilePage'
          headers:
            Content-Disposition:
              schema:
                type: string
        default:
          $ref: '#/components/responses/Error'
  /api/v1/events/{event_id}/attendance:
    parameters:
      - $ref: '#/components/parameters/EventID'
    get:
      operationId: getAttendance
      description: Organiser/logistics shared check-in roster, without sensitive fields. Only confirmed competitors appear. Counts and roster_as_of describe the current transaction snapshot; physical arrival never changes admission or the event minimum.
      parameters:
        - {name: day, in: query, schema: {type: string, pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'}}
      responses:
        '200':
          description: Event-local day roster and separate competitor, staff, overlap and catering counts.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AttendancePage'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/events/{event_id}/attendance/catering:
    parameters:
      - $ref: '#/components/parameters/EventID'
    put:
      operationId: configureCatering
      description: Organiser-only buffer configuration using the event revision in If-Match. Staff already competing are counted once in catering, while only confirmed competitors count toward the minimum.
      parameters:
        - $ref: '#/components/parameters/CSRF'
        - $ref: '#/components/parameters/ProfileRevision'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [buffer]
              properties:
                buffer: {type: integer, minimum: 0, maximum: 10000}
      responses:
        '200':
          description: Updated event revision and current headcounts.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AttendancePage'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/events/{event_id}/attendance/{person_id}/{day}:
    parameters:
      - $ref: '#/components/parameters/EventID'
      - {name: person_id, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: day, in: path, required: true, schema: {type: string, pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'}}
    put:
      operationId: recordAttendance
      description: Use the person's attendance revision for this day in If-Match, zero for no record. Retrying the same request_id returns current state; reuse with different content conflicts. Only current confirmed competitors can be checked in. Corrections require a reason. An old retry cannot undo a later correction.
      parameters:
        - $ref: '#/components/parameters/CSRF'
        - $ref: '#/components/parameters/ProfileRevision'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AttendanceCommand'}
      responses:
        '200':
          description: Current per-day arrival state.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AttendanceEntry'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/events/{event_id}/attendance/{person_id}/{day}/history:
    parameters:
      - $ref: '#/components/parameters/EventID'
      - {name: person_id, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: day, in: path, required: true, schema: {type: string, pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'}}
    get:
      operationId: attendanceHistory
      description: Up to 200 immutable arrival/correction records, newest first. Current organiser/logistics permission is required, including after a participant withdraws. Duplicate scans do not create another change.
      responses:
        '200':
          description: Restricted correction history.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/AttendanceChange'}}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/events/{event_id}/logistics:
    parameters:
      - $ref: '#/components/parameters/EventID'
    get:
      operationId: getLogistics
      description: Logistics-role-only contact, dietary, accessibility, travel and social data for current confirmed competitors and active staff. Unknown social attendance is not consent. Photo consent remains in the photographer profile interface. Each page rechecks current roles and roster membership.
      parameters:
        - {name: after, in: query, schema: {type: string, format: uuid}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}
      responses:
        '200':
          description: Current operational projection, excluding photo consent and all registration answers.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LogisticsPage'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/events/{event_id}/logistics/export:
    parameters:
      - $ref: '#/components/parameters/EventID'
    get:
      operationId: exportLogistics
      description: Audited paginated JSON export. Current logistics role is required for every page; organisers and platform administrators have no implicit sensitive-field access.
      parameters:
        - {name: after, in: query, schema: {type: string, format: uuid}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}
      responses:
        '200':
          description: Operational roster export page; follow next_cursor until null.
          headers:
            Content-Disposition:
              schema: {type: string}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LogisticsPage'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/events/{event_id}/communications/automation:
    get:
      operationId: getCommunicationAutomation
      parameters:
        - $ref: '#/components/parameters/EventID'
        - in: query
          name: bindings_after
          description: Exclusive UUID cursor for current bindings; independent of occurrences_after.
          schema: {type: string, format: uuid}
        - in: query
          name: occurrences_after
          description: Exclusive UUID cursor for occurrences; retain the final cursor of an exhausted collection while paging the other.
          schema: {type: string, format: uuid}
        - in: query
          name: limit
          schema: {type: integer, minimum: 1, maximum: 200, default: 50}
      responses:
        '200':
          description: Current organiser-only automation bindings, pause and durable review states.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AutomationPage'}
        default: {$ref: '#/components/responses/Error'}
    post:
      operationId: changeCommunicationAutomation
      parameters:
        - $ref: '#/components/parameters/EventID'
        - $ref: '#/components/parameters/CSRF'
        - $ref: '#/components/parameters/Revision'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AutomationCommand'}
      responses:
        '200':
          description: Explicit reviewed automation change; never a content-publication or external-send operation.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AutomationChange'}
        default: {$ref: '#/components/responses/Error'}
