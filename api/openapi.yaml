components:
  securitySchemes:
    display:
      type: http
      scheme: bearer
      bearerFormat: opaque
    session: { type: apiKey, in: cookie, name: hackbox_session }
  parameters:
    EventID:
      name: event_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    CSRF:
      name: X-CSRF-Token
      in: header
      required: true
      schema: { type: string, minLength: 32, maxLength: 128 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, format: uuid }
    PresentationRevision:
      name: If-Match
      in: header
      required: true
      description: Quoted presentation revision, starting at "0".
      schema: {type: string, pattern: '^"(0|[1-9][0-9]*)"$'}
    Revision:
      name: If-Match
      in: header
      required: true
      description: Quoted event revision, for example "1".
      schema: { type: string, pattern: '^"[1-9][0-9]*"$' }
    Cursor:
      name: cursor
      in: query
      schema: { type: integer, format: int64, minimum: 0, default: 0 }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
    ProfileRevision:
      name: If-Match
      in: header
      required: true
      description: >-
        Quoted profile revision. Use "0" to create a missing profile; existing profiles require their current
        revision.
      schema:
        type: string
        pattern: ^"[0-9]+"$
  responses:
    Error:
      description: |
        400 invalid_request; 401 unauthenticated; 403 forbidden or csrf_invalid;
        404 not_found; 409 revision_conflict or idempotency_conflict;
        413 body_too_large or quota_exceeded; 415 unsupported_media;
        500 internal_error; 503 unavailable or object_missing.
        Messages are safe for display. Application policy enforces authorization.
      headers:
        X-Request-ID: { schema: { type: string } }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  schemas:
    SMTPTestDeliveryStatus:
      type: object
      additionalProperties: false
      required: [state, reason, updated_at]
      properties:
        state: { type: string, enum: [pending, accepted, retryable, permanent, ambiguous, cancelled] }
        reason: { type: string }
        updated_at: { type: string, format: date-time, nullable: true }
    AccountEmailStatus:
      type: object
      additionalProperties: false
      required: [configured, verified, masked_mailbox, provenance, pending, request_state, expires_at, retry_after_seconds]
      properties:
        configured: { type: boolean }
        verified: { type: boolean }
        masked_mailbox: { type: string }
        provenance: { type: string, enum: ['', oidc_verified, code_confirmed] }
        pending: { type: boolean }
        request_state: { type: string, enum: ['', prepared, accepted, retryable, permanent, ambiguous] }
        expires_at: { type: string, format: date-time, nullable: true }
        retry_after_seconds: { type: integer, format: int64, minimum: 0 }
    Health:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [ok] }
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, request_id]
          properties:
            code: { type: string }
            message: { type: string }
            request_id: { type: string }
            blockers: { type: array, items: { $ref: '#/components/schemas/Blocker' } }
    Session:
      type: object
      required: [person, csrf_token, can_create_events]
      properties:
        person:
          type: object
          required: [id, display_name, platform_admin]
          properties:
            id: { type: string, format: uuid }
            display_name: { type: string }
            platform_admin: { type: boolean }
        csrf_token: { type: string }
        can_create_events: { type: boolean }
    AuditEvent:
      type: object
      required: [id, sequence, action, target_id, reason_code, occurred_at, metadata]
      properties:
        id: { type: string, format: uuid }
        sequence: { type: integer, format: int64 }
        actor_id: { type: string, format: uuid }
        action: { type: string }
        target_id: { type: string, format: uuid }
        reason_code: { type: string }
        occurred_at: { type: string, format: date-time }
        metadata:
          type: object
          additionalProperties: false
          properties:
            result: { type: string, enum: [success, denied, unavailable, not_found, conflict] }
            reference_id: { type: string, format: uuid }
            previous_revision: { type: integer, format: int64 }
            revision: { type: integer, format: int64 }
            count: { type: integer }
            role: { $ref: '#/components/schemas/StaffRole' }
    AuditPage:
      type: object
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/AuditEvent' } }
        next_cursor: { type: integer, format: int64 }
    File:
      type: object
      required: [id, event_id, owner_id, filename, media_type, checksum, size_bytes, created_at]
      properties:
        id: { type: string, format: uuid }
