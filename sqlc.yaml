version: '2'
sql:
  - engine: postgresql
    schema: [internal/database/migrations, internal/automation/schema.provisional.sql]
    queries: internal/database/queries
    gen:
      go:
        package: dbgen
        out: internal/database/dbgen
        sql_package: pgx/v5
        emit_empty_slices: true
        overrides:
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
          - db_type: uuid
            nullable: true
            go_type:
              import: github.com/google/uuid
              type: UUID
              pointer: true
          - db_type: timestamptz
            go_type: time.Time
