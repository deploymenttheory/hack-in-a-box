name: Native live rehearsal
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live-rehearsal:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      GOMAXPROCS: '2'
      GOFLAGS: '-p=1'
      HACKBOX_INTEGRATION: '1'
      HACKBOX_LIVE_REHEARSAL: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.3
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci
      - run: npx playwright install --with-deps chromium firefox
        working-directory: web
      - run: npm --prefix web run build
      - name: Real PostgreSQL, native HTTP and production browsers
        run: go test -v -race -p 1 -parallel 1 ./internal/app -run '^TestLiveRehearsal(NativeAuthority|Browsers|SupportClockPropagation)$' -count=1 -timeout=10m
      - name: Native optional session booking browsers
        env:
          HACKBOX_SESSION_BROWSER: '1'
        run: go test -v -race -p 1 -parallel 1 ./internal/app -run '^TestSessionBookingBrowsers$' -count=1 -timeout=5m
      - name: Native submitted-build and cutoff evidence browsers
        env:
          HACKBOX_FREEZE_BROWSER: '1'
        run: go test -v -race -p 1 -parallel 1 ./internal/app -run '^TestSubmissionFreezeBrowsers$' -count=1 -timeout=5m
      - name: Native independent judge UI browsers
        env:
          HACKBOX_JUDGE_BROWSER: '1'
        run: go test -v -race -p 1 -parallel 1 ./internal/app -run '^TestJudgeUIBrowsers$' -count=1 -timeout=8m
      - name: Native moderation panel browsers
        env:
          HACKBOX_QUALIFICATION_BROWSER: '1'
        run: go test -v -race -p 1 -parallel 1 ./internal/app -run '^TestQualificationBrowsers$' -count=1 -timeout=10m
      - name: Native results and team feedback report browsers
        env:
          HACKBOX_REPORT_BROWSER: '1'
        run: go test -v -race -p 1 -parallel 1 ./internal/app -run '^TestTeamReportsUIBrowsers$' -count=1 -timeout=15m
      - name: Native reviewed project showcase browsers
        env:
          HACKBOX_SHOWCASE_BROWSER: '1'
        run: go test -v -race -p 1 -parallel 1 ./internal/app -run '^TestShowcaseBrowsers$' -count=1 -timeout=10m
      - name: Native mentor advisory and judge category-tie browsers
        env:
          HACKBOX_ADVISORY_BROWSER: '1'
        run: go test -v -race -p 1 -parallel 1 ./internal/app -run '^TestMentorAdvisoryBrowsers$' -count=1 -timeout=10m
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: native-live-rehearsal-proof
          path: web/test-results-live
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: native-session-booking-proof
          path: web/test-results-sessions-native
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: native-submitted-build-proof
          path: web/test-results-freeze-native
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: native-judge-ui-proof
          path: web/test-results-judging-native
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: native-moderation-panel-proof
          path: web/test-results-qualification-native
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: native-results-report-proof
          path: web/test-results-reports-native
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: native-project-showcase-proof
          path: web/test-results-showcase-native
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: native-mentor-advisory-proof
          path: web/test-results-advisory-native
          retention-days: 7
