name: Native live rehearsal
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live-rehearsal:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GOMAXPROCS: '2'
      GOFLAGS: '-p=1'
      HACKBOX_INTEGRATION: '1'
      HACKBOX_LIVE_REHEARSAL: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: 22.23.3
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci
      - run: npx playwright install --with-deps chromium firefox
        working-directory: web
      - run: npm --prefix web run build
      - name: Real PostgreSQL, native HTTP and production browsers
        run: go test -v -race -p 1 -parallel 1 ./internal/app -run '^TestLiveRehearsal(NativeAuthority|Browsers)$' -count=1 -timeout=10m
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: native-live-rehearsal-proof
          path: web/test-results-live
          retention-days: 7
