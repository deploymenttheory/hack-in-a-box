name: Go checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Verify formatting
        run: test -z "$(gofmt -l cmd internal)"
      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: 22.23.3
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install browser tooling
        run: npm --prefix web ci
      - name: Verify modules
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
          go mod verify
      - name: Build
        run: go build ./cmd/... ./internal/...
      - name: Review all Go module and runtime advisories
        working-directory: cmd/api
        run: go tool govulncheck -scan=module
      - name: Vet
        run: go vet ./cmd/... ./internal/...
      - name: Race tests
        env:
          HACKBOX_INTEGRATION: '1'
        run: go test -race -timeout 5m ./cmd/... ./internal/...
      - name: Verify generated contracts and queries
        run: sh scripts/check-generated.sh
