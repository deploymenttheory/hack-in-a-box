name: Go checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6.2.0
        with:
          go-version-file: go.mod
      - name: Verify formatting
        run: test -z "$(gofmt -l cmd internal)"
      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: 22.23.3
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install browser tooling
        run: npm --prefix web ci
      - name: Verify modules
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
          go mod verify
      - name: Build
        run: go build ./cmd/... ./internal/...
      - name: Vet
        run: go vet ./cmd/... ./internal/...
      - name: Race tests
        env:
          HACKBOX_INTEGRATION: '1'
        run: go test -race -timeout 5m ./cmd/... ./internal/...
      - name: Verify generated contracts and queries
        run: sh scripts/check-generated.sh
