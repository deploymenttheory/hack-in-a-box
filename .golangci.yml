version: '2'
run:
  timeout: 10m
  modules-download-mode: readonly
  concurrency: 2
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  uniq-by-line: false
  new: false
  fix: false
linters:
  default: none
  enable:
    - govet
    - staticcheck
    - errcheck
    - unused
    - ineffassign
    - errorlint
    - err113
    - bodyclose
    - gosec
    - contextcheck
    - noctx
    - nilnil
    - gocritic
    - prealloc
    - misspell
    - gocyclo
    - wrapcheck
    - musttag
    - tagliatelle
  settings:
    tagliatelle:
      case:
        rules:
          json: snake
  exclusions:
    generated: strict
    presets: [comments, std-error-handling, common-false-positives, legacy]
    # Tests still compile, run with -race and pass go vet in the Go checks job.
    paths:
      - '_test\.go$'
formatters:
  enable: [gofumpt, goimports, gci, golines]
  settings:
    gci:
      sections:
        - Standard
        - Default
        - Prefix(github.com/deploymenttheory)
  exclusions:
    generated: strict
output:
  formats:
    text:
      path: stderr
      print-linter-name: true
      print-issued-lines: true
  show-stats: true
