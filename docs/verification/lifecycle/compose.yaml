name: hackbox-lifecycle
x-fixture: &fixture
  image: ${HACKBOX_LIFECYCLE_IMAGE:-hackbox-lifecycle:verification}
  build:
    context: ../../..
    dockerfile: docs/verification/lifecycle/Dockerfile
  init: true
  cpus: 0.5
  mem_limit: 256m
  pids_limit: 128
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  networks: [synthetic]
  environment: &environment
    GOMAXPROCS: '2'
    HACKBOX_ENV: test
    HACKBOX_DATABASE_URL: postgres://lifecycle:synthetic-lifecycle-only@postgres:5432/lifecycle?sslmode=disable
    HACKBOX_HTTP_ADDR: 0.0.0.0:8080
    HACKBOX_PUBLIC_ORIGIN: http://public:8080
    HACKBOX_ADMIN_ORIGIN: http://admin:8080
    HACKBOX_WORKSPACE_ORIGIN: http://public:8080
    HACKBOX_STORAGE_PATH: /data/files
    HACKBOX_WEB_DIR: /app/web-public
    HACKBOX_OIDC_ISSUER: http://provider:8080
    HACKBOX_OIDC_CLIENT_ID: lifecycle-public
    HACKBOX_OIDC_CLIENT_SECRET: synthetic-lifecycle-secret
    HACKBOX_BOOTSTRAP_SUBJECT: owner
    HACKBOX_GITHUB_CLIENT_ID: lifecycle-github
    HACKBOX_GITHUB_CLIENT_SECRET: synthetic-github-secret
    HACKBOX_GITHUB_TOKEN_KEY: AQIDBAUGBwgJCgsMDQ4PEBESExQVFhcYGRobHB0eHyA=
    # Public synthetic-only fixture key; normal config/encryption owners remain active.
    HACKBOX_CREDENTIAL_KEYRING: '{"active":"lifecycle","keys":{"lifecycle":"AQIDBAUGBwgJCgsMDQ4PEBESExQVFhcYGRobHB0eHyA="}}'
    HACKBOX_SMTP_HOST: provider
    HACKBOX_SMTP_PORT: '2525'
    HACKBOX_SMTP_TLS_MODE: tls
    HACKBOX_SMTP_USERNAME: lifecycle
    HACKBOX_SMTP_PASSWORD: synthetic-relay-secret
    HACKBOX_SMTP_FROM: lifecycle@example.test
    HACKBOX_SMTP_MESSAGE_DOMAIN: example.test
    HACKBOX_SMTP_TIMEOUT: 10s
    SSL_CERT_FILE: /control/ca.pem
    HACKBOX_LIFECYCLE_ISOLATED: synthetic-only
    HACKBOX_LIFECYCLE_CONTROL: /control
  command: ['-test.run=^TestLifecycleComposeProcess$', '-test.timeout=60m', '-test.v']
  volumes: [files:/data/files, 'control:/control:ro']
  depends_on:
    migrate: {condition: service_completed_successfully}
    provider: {condition: service_healthy}
services:
  postgres:
    image: postgres:17.7-bookworm@sha256:86e0b703649d7a792bd9243ee28afc9d8f7c6b2b5638077c9d6882d4d472bbfd
    networks: [synthetic]
    cpus: 0.75
    mem_limit: 384m
    pids_limit: 128
    environment:
      POSTGRES_DB: lifecycle
      POSTGRES_USER: lifecycle
      POSTGRES_PASSWORD: synthetic-lifecycle-only
    volumes: [database:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U lifecycle -d lifecycle']
      interval: 2s
      timeout: 2s
      retries: 30
  migrate:
    <<: *fixture
    entrypoint: [/app/migrate]
    command: []
    volumes: []
    depends_on:
      postgres: {condition: service_healthy}
  provider:
    <<: *fixture
    environment:
      <<: *environment
      HACKBOX_LIFECYCLE_ROLE: provider
    volumes: [control:/control]
    depends_on: {}
    healthcheck: &healthcheck
      test: [CMD, /app/healthcheck]
      interval: 2s
      timeout: 5s
      retries: 30
  public:
    <<: *fixture
    environment:
      <<: *environment
      HACKBOX_LIFECYCLE_ROLE: public
    healthcheck: *healthcheck
  admin:
    <<: *fixture
    environment:
      <<: *environment
      HACKBOX_LIFECYCLE_ROLE: admin
      HACKBOX_SURFACE: admin
      HACKBOX_PUBLIC_ORIGIN: http://admin:8080
      HACKBOX_OIDC_CLIENT_ID: lifecycle-admin
      HACKBOX_WEB_DIR: /app/web-admin
    healthcheck: *healthcheck
  worker:
    <<: *fixture
    environment:
      <<: *environment
      HACKBOX_LIFECYCLE_ROLE: worker
  styleguide:
    image: ${HACKBOX_LIFECYCLE_GUIDE_IMAGE:-hackbox-lifecycle:styleguide-verification}
    build:
      context: ../../..
      dockerfile: Dockerfile
      target: styleguide
      args:
        STYLEGUIDE_REVISION: lifecycle-verification
    init: true
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [synthetic]
    healthcheck: *healthcheck
  bootstrap:
    <<: *fixture
    profiles: [bootstrap]
    command: ['-test.run=^TestLifecycleComposeBootstrap$', '-test.timeout=2m', '-test.v']
    volumes: ['control:/control:ro', 'artifacts:/artifacts']
    depends_on:
      public: {condition: service_healthy}
      admin: {condition: service_healthy}
  admission:
    <<: *fixture
    profiles: [admission]
    command: ['-test.run=^TestLifecycleComposeAdmission$', '-test.timeout=5m', '-test.v']
    volumes: ['control:/control:ro', 'artifacts:/artifacts']
    depends_on:
      public: {condition: service_healthy}
      admin: {condition: service_healthy}
  publication:
    <<: *fixture
    profiles: [publication]
    command: ['-test.run=^TestLifecycleComposePublication$', '-test.timeout=5m', '-test.v']
    volumes: ['control:/control:ro', 'artifacts:/artifacts']
    depends_on:
      public: {condition: service_healthy}
      admin: {condition: service_healthy}
      worker: {condition: service_started}
  smtp:
    <<: *fixture
    profiles: [smtp]
    command: ['-test.run=^TestLifecycleComposeSMTP$', '-test.timeout=3m', '-test.v']
    volumes: ['control:/control:ro', 'artifacts:/artifacts']
    depends_on:
      public: {condition: service_healthy}
      admin: {condition: service_healthy}
      worker: {condition: service_started}

  dispatch-window:
    <<: *fixture
    environment:
      <<: *environment
      HACKBOX_LIFECYCLE_DISPATCH_CASE: ${HACKBOX_LIFECYCLE_DISPATCH_CASE:-last-on-time}
      HACKBOX_LIFECYCLE_INTENT_JOURNAL: /artifacts/intent-journal.jsonl
    profiles: [dispatch-window]
    command: ['-test.run=^TestLifecycleComposeDispatchWindow$', '-test.timeout=3m', '-test.v']
    volumes: ['control:/control:ro', 'artifacts:/artifacts']
    # The host starts the real worker after the runner's private ready barrier.
    depends_on:
      public: {condition: service_healthy}
      admin: {condition: service_healthy}

  browser-proxy:
    <<: *fixture
    profiles: [browser]
    networks: [synthetic, browser-edge]
    environment:
      <<: *environment
      HACKBOX_LIFECYCLE_ROLE: browser-proxy
    ports: ['127.0.0.1:${HACKBOX_LIFECYCLE_BROWSER_PROXY_PORT:-18088}:8080']
    healthcheck: *healthcheck
    depends_on:
      public: {condition: service_healthy}
      admin: {condition: service_healthy}
      styleguide: {condition: service_healthy}

  journey:
    <<: *fixture
    environment:
      <<: *environment
      HACKBOX_LIFECYCLE_INTENT_JOURNAL: /artifacts/intent-journal.jsonl
      HACKBOX_LIFECYCLE_RETENTION_CASE: ${HACKBOX_LIFECYCLE_RETENTION_CASE:-configured120}
    profiles: [journey]
    # The connected help/feedback baseline takes ~480s. Clarification/correction
    # adds >500 actual current-audience HTTP reads. Individual guards stay unchanged.
    command: ['-test.run=^TestLifecycleComposeJourney$', '-test.timeout=12m', '-test.v']
    volumes: ['control:/control:ro', 'artifacts:/artifacts']
    depends_on:
      public: {condition: service_healthy}
      admin: {condition: service_healthy}
      worker: {condition: service_started}

volumes:
  database:
  files:
  control:
  artifacts:
networks:
  synthetic: {internal: true}
  browser-edge: {}
