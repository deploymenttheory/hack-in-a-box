<script>
(()=>{
 const root=document.getElementById('hf-v2'),product=root.querySelector('.hf-product'),view=root.querySelector('.hf-view'),backdrop=root.querySelector('.hf-modal-backdrop'),modal=root.querySelector('.hf-modal');
 const teams=[{id:'atlas',name:'Team Atlas',members:4,repo:'Unknown result',access:'Not requested',tone:'warning',issue:'Repository recovery',people:['Nina Park','Theo Watts']},{id:'kestrel',name:'Team Kestrel',members:5,repo:'Ready',access:'Identity missing',tone:'warning',issue:'Verify linked account',people:['Jules Shaw','Amira Patel']},{id:'orion',name:'Team Orion',members:5,repo:'Ready',access:'Plan needs review',tone:'warning',issue:'Review access plan',people:['Mina Hart','Leo Reed']},{id:'cedar',name:'Team Cedar',members:6,repo:'Ready',access:'Accepted',tone:'good',issue:'Ready',people:['Luca Shah','Ari Miller']},{id:'ember',name:'Team Ember',members:4,repo:'Ready',access:'Accepted',tone:'good',issue:'Ready',people:['Rae Lewis','Bo Chen']},{id:'beacon',name:'Team Beacon',members:0,repo:'Unused',access:'Disbanded',tone:'muted',issue:'Unused / unscored',people:[]}];
 const state={concept:'workspace',portal:'admin',phase:'preparation',event:'northstar',page:'teams',query:'',filter:'all',sort:'name',asc:true,cursor:0,selected:new Set(),detail:null,tab:'overview',columns:{members:true,repository:true,access:true},popover:null,flow:null,busy:false,draft:{label:'Working prototype',repository:'https://github.com/northstar/team-kestrel',demo:'',includeDemo:true,note:''},errors:{},draftRevision:0,acceptedRevision:0,activity:[],response:'success',intent:0,unknown:null,signedOut:false};
 const originalTeams=JSON.stringify(teams);
 let toastTimer,trigger,responseEpoch=0;
 const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const icon=n=>`<i data-lucide="${n==='github'?'git-branch':n}" aria-hidden="true"></i>`;
 const btn=(label,action,style='secondary',glyph='',extra='')=>`<button type="button" class="hf-button hf-button-${style}" data-action="${action}" ${extra}>${glyph?icon(glyph):''}${label}</button>`;
 const status=(text,tone='muted')=>`<span class="hf-status" data-tone="${tone}">${icon(text.includes('Queued')||text.includes('Pending')?'clock-3':tone==='good'?'circle-check':tone==='warning'?'circle-alert':'circle-minus')}${esc(text)}</span>`;
 const title=(text,glyph,action='')=>`<div class="hf-title-row"><h1>${icon(glyph)}${text}</h1>${action}</div>`;
 const advisory=(text,glyph='info')=>`<div class="hf-advisory">${icon(glyph)}<span>${text}</span></div>`;
 const definitions=rows=>`<dl class="hf-definition">${rows.map(([a,b])=>`<div><dt>${a}</dt><dd>${b}</dd></div>`).join('')}</dl>`;
 function icons(){if(globalThis.lucide)globalThis.lucide.createIcons({attrs:{width:16,height:16,'stroke-width':1.7}})}
 function notice(message,tone='good'){clearTimeout(toastTimer);const node=root.querySelector('.hf-toast');node.innerHTML=icon(tone==='error'?'circle-alert':'circle-check')+`<span>${esc(message)}</span><button type="button" class="hf-icon-button" data-action="dismiss-toast" aria-label="Dismiss message">${icon('x')}</button>`;node.dataset.tone=tone;node.hidden=false;icons();toastTimer=setTimeout(()=>{node.hidden=true},7000)}
 const contextLine=()=>state.event==='spring'?`<div class="hf-statusline"><span>${status('Draft event')}</span><span>0 confirmed / minimum 30</span><span>No published allocation</span><span>Challenge not released</span></div>`:`<div class="hf-statusline"><span>${state.phase==='registration'?status('Go decision pending','warning'):status('Go confirmed','good')}</span><span>${state.phase==='registration'?'24 confirmed / minimum 30':'54 confirmed / minimum 30'}</span><span>${state.phase==='registration'?'Teams not frozen':'Teams frozen'}</span><span>${state.phase==='registration'?'Challenge not released':state.phase==='closed'?'Submission window closed':'Challenge released'}</span></div>`;
 function filtered(){if(state.event==='spring')return [];return teams.map(t=>state.phase==='registration'?{...t,repo:'Not provisioned',access:'Awaiting publication',tone:'muted',issue:'Review allocation'}:t).filter(t=>(!state.query||`${t.name} ${t.repo} ${t.access}`.toLowerCase().includes(state.query.toLowerCase()))&&(state.filter==='all'||state.filter==='attention'&&(t.repo==='Unknown result'||t.repo==='Not provisioned'||['Identity missing','Plan needs review','Effect uncertain'].includes(t.access))||state.filter==='ready'&&t.repo==='Ready'&&t.access==='Accepted'||state.filter==='unused'&&t.members===0)).sort((a,b)=>(state.sort==='members'?a.members-b.members:a.name.localeCompare(b.name))*(state.asc?1:-1))}
 function collection(){
  const list=filtered(),pages=Math.ceil(list.length/4);state.cursor=Math.max(0,Math.min(state.cursor,pages-1));const rows=list.slice(state.cursor*4,state.cursor*4+4),selected=state.selected.size;
  return title(state.concept==='queue'?'Action queue':'Teams','users-round',btn(state.concept==='queue'?'Review next issue':'Review access','review-primary','primary','list-checks'))+contextLine()+`<div class="hf-toolbar"><div class="hf-toolbar-left">${selected?`<strong class="hf-selection">${selected} selected</strong>${btn('Review selected','review-selected','ghost','list-checks')}${btn('Clear selection','clear-selection','ghost','x')}`:`<strong>${list.length} ${state.concept==='queue'?'teams in queue':'teams'}</strong>${btn('Export teams','export','ghost','download')}`}</div><div class="hf-toolbar-right"><div class="hf-menu-anchor">${btn('Columns','columns','ghost','columns-3')}${state.popover==='columns'?`<div class="hf-popover" aria-label="Visible columns">${Object.entries(state.columns).map(([key,on])=>`<label><input type="checkbox" data-column="${key}" ${on?'checked':''}>${{members:'Members',repository:'Repository',access:'Access'}[key]}</label>`).join('')}</div>`:''}</div><label class="hf-filter">${icon('list-filter')}<span class="hf-sr">Team status</span><select id="hf-filter"><option value="all" ${state.filter==='all'?'selected':''}>All teams</option><option value="attention" ${state.filter==='attention'?'selected':''}>Needs attention</option><option value="ready" ${state.filter==='ready'?'selected':''}>Ready</option><option value="unused" ${state.filter==='unused'?'selected':''}>Unused</option></select></label><label class="hf-search">${icon('search')}<span class="hf-sr">Search teams</span><input id="hf-search" placeholder="Search teams" value="${esc(state.query)}">${state.query?`<button type="button" class="hf-icon-button" data-action="clear-search" aria-label="Clear search">${icon('x')}</button>`:''}</label></div></div>${state.query||state.filter!=='all'?`<div class="hf-filter-chip">${list.length} matching teams ${btn('Clear filters','clear-filters','link')}</div>`:''}<div class="hf-table-wrap"><table class="hf-table" aria-label="Team repository readiness"><thead><tr><th><input type="checkbox" id="hf-select-all" aria-label="Select teams on this page" ${rows.length&&rows.every(t=>state.selected.has(t.id))?'checked':''}></th><th aria-sort="${state.sort==='name'?(state.asc?'ascending':'descending'):'none'}"><button type="button" class="hf-sort" data-sort="name">Team ${icon(state.sort==='name'?(state.asc?'arrow-up':'arrow-down'):'arrow-up-down')}</button></th>${state.columns.members?`<th aria-sort="${state.sort==='members'?(state.asc?'ascending':'descending'):'none'}"><button type="button" class="hf-sort" data-sort="members">Members ${icon('arrow-up-down')}</button></th>`:''}${state.columns.repository?'<th>Repository</th>':''}${state.columns.access?'<th>Access</th>':''}<th><span class="hf-sr">Team actions</span></th></tr></thead><tbody>${rows.map(t=>`<tr data-selected="${state.selected.has(t.id)||state.detail===t.id}"><td><input type="checkbox" data-select="${t.id}" aria-label="Select ${t.name}" ${state.selected.has(t.id)?'checked':''}></td><td><button type="button" class="hf-name-link" data-team="${t.id}">${icon(t.members?'users-round':'archive')}${t.name}</button><small>${state.concept==='queue'?t.issue:t.members?(state.phase==='registration'?'Draft allocation':'Published allocation'):'Disbanded · unscored'}</small></td>${state.columns.members?`<td data-label="Members">${t.members||'—'}</td>`:''}${state.columns.repository?`<td data-label="Repository">${status(t.repo,t.repo==='Ready'?'good':t.tone)}</td>`:''}${state.columns.access?`<td data-label="Access">${status(t.access,t.tone)}</td>`:''}<td><button type="button" class="hf-icon-button" data-row-menu="${t.id}" aria-label="More actions for ${t.name}" data-tooltip="Team actions">${icon('ellipsis')}</button></td></tr>`).join('')}</tbody></table>${!list.length?`<div class="hf-empty">${icon('search')}<h2>${state.event==='spring'?'No published teams yet':'No teams match your filters'}</h2><p>${state.event==='spring'?'Review an allocation before explicitly publishing it.':'Change your search or clear the current filters.'}</p>${btn(state.event==='spring'?'Review allocation':'Clear filters',state.event==='spring'?'allocation':'clear-filters','secondary',state.event==='spring'?'users-round':'x')}</div>`:''}</div><div class="hf-table-footer"><span>${list.length?`${state.cursor*4+1}–${Math.min(state.cursor*4+4,list.length)} of ${list.length} teams`:'0 teams'} · ${state.phase==='registration'?'Draft planning':'Frozen allocation'}</span>${pages>1?`<div>${btn('Previous','prev','ghost','chevron-left',state.cursor===0?'disabled':'')}${btn('Next','next','ghost','chevron-right',state.cursor===pages-1?'disabled':'')}</div>`:''}</div>`;
 }
 function teamContent(t,compact=false){
  if(state.phase==='registration')return `${compact?`<h2>${t.name}</h2>`:''}${definitions([['Allocation','Unpublished draft'],['Members',t.members||'—'],['Repository','Not provisioned'],['Access','Awaiting publication']])}${advisory('Review and explicitly publish this roster before freeze. Draft allocation does not create repositories or grant access.')}${btn('Review allocation','allocation','secondary','users-round')}`;
  if(t.access==='Effect uncertain')return `${compact?`<h2>${t.name}</h2>`:''}${definitions([['Repository',status(t.repo,'good')],['Access',status('Effect uncertain','warning')]])}${advisory('The invitation effect is uncertain. Inspect current provider status before approving another change.','circle-alert')}${btn('Check access status','access-status','primary','refresh-cw')}`;
  const actions=t.id==='atlas'&&t.repo==='Unknown result'?btn('Review recovery','recover','primary','refresh-cw',`data-id="${t.id}"`):t.access==='Plan needs review'?btn('Review access plan','invite','primary','user-round-plus',`data-id="${t.id}"`):t.id==='kestrel'?btn('View connection steps','account','primary','github'):btn('View activity','activity','secondary','history');
  return `${compact?`<div class="hf-title-row"><h2>${t.name}</h2></div>`:''}<div class="hf-tabs" role="tablist" aria-label="Team detail"><button type="button" data-tab="overview" role="tab" aria-selected="${state.tab==='overview'}">${icon('layout-list')}Overview</button><button type="button" data-tab="access" role="tab" aria-selected="${state.tab==='access'}">${icon('key-round')}Access</button><button type="button" data-tab="activity" role="tab" aria-selected="${state.tab==='activity'}">${icon('history')}Activity</button></div>${state.tab==='activity'?`<ul class="hf-activity">${[...state.activity.filter(a=>a.team===t.id),{text:t.members?'Allocation published and frozen':'Team disbanded; repository retained',time:'12 Jun · 17:00'}].map(a=>`<li>${icon('history')}<span>${esc(a.text)}<small>${a.time}</small></span></li>`).join('')}</ul>`:definitions([['Allocation',t.members?(state.phase==='registration'?'Draft':'Frozen'):'Disbanded'],['Members',t.members||'—'],['Repository',status(t.repo,t.repo==='Ready'?'good':t.tone)],['Access',status(t.access,t.tone)],...(state.tab==='access'?[['Permission','Team contributor · write'],['Managed grants','Only verified, app-managed access']]:[])])+advisory(!t.members?'This repository is unused and unscored. No repository transfer is needed.':t.id==='atlas'&&t.repo==='Unknown result'?'The provider result is unknown. Review evidence before recovery; creating another repository is not a safe retry.':t.id==='kestrel'?'Jules needs to verify a GitHub account. An organiser cannot verify a typed username on their behalf.':t.id==='orion'&&t.access==='Plan needs review'?'A current access plan needs organiser approval. Review the people and exact changes before confirming.':'This team’s repository and access are ready.','info')+actions}`;

 root.addEventListener('change',e=>{const t=e.target;if(t.id==='hf-portal'){state.portal=t.value;state.page=t.value==='admin'?'teams':'today';changeScope()}else if(t.id==='hf-phase'){state.phase=t.value;changeScope()}else if(t.id==='hf-event'){state.event=t.value;changeScope()}else if(t.id==='hf-filter'){state.filter=t.value;state.cursor=0;render()}else if(t.dataset.select){t.checked?state.selected.add(t.dataset.select):state.selected.delete(t.dataset.select);render()}else if(t.id==='hf-select-all'){filtered().slice(state.cursor*4,state.cursor*4+4).forEach(team=>t.checked?state.selected.add(team.id):state.selected.delete(team.id));render()}else if(t.dataset.column){state.columns[t.dataset.column]=t.checked;render()}else if(t.dataset.person){t.checked?state.flow.checked.add(+t.dataset.person):state.flow.checked.delete(+t.dataset.person);renderFlow()}else if(t.id==='hf-include-demo'){state.draft.includeDemo=t.checked;delete state.errors.demo;renderFlow()}});
 root.addEventListener('submit',e=>{if(e.target.id==='hf-evidence-form'){e.preventDefault();if(validateAll()){state.flow.step=1;renderFlow()}}});
 root.addEventListener('click',e=>{const el=e.target.closest('button');if(!el||!root.contains(el)||el.disabled)return;
  if(el.dataset.concept){state.concept=el.dataset.concept;state.detail=state.concept==='review'?'atlas':null;state.tab='overview';state.filter=state.concept==='queue'?'attention':'all';state.query='';state.cursor=0;state.columns={members:state.concept!=='review',repository:true,access:true};closeFlow();render();return}
  if(el.dataset.page||el.dataset.commandPage){navigate(el.dataset.page||el.dataset.commandPage);return}
  if(el.dataset.team||el.dataset.modalPage){state.page=state.portal==='admin'?'teams':'my-team';state.detail=el.dataset.team||el.dataset.modalPage;state.tab='overview';closeFlow();render();return}
  if(el.dataset.sort){state.asc=state.sort===el.dataset.sort?!state.asc:true;state.sort=el.dataset.sort;render();return}
  if(el.dataset.tab){state.tab=el.dataset.tab;render();return}
  if(el.dataset.rowMenu){openFlow('row',el.dataset.rowMenu);return}
  if(el.dataset.modalActivity){state.detail=el.dataset.modalActivity;state.tab='activity';closeFlow();render();return}
  if(el.dataset.startRecovery){openFlow(el.dataset.startRecovery==='atlas'?'recover':'invite',el.dataset.startRecovery);return}
  const a=el.dataset.action;if(!a)return;
  if(a==='close-modal'){closeFlow();return}if(a==='dismiss-toast'){root.querySelector('.hf-toast').hidden=true;return}
  if(a==='home'){navigate(state.portal==='admin'?'overview':'today');return}
  if(a==='inbox'){navigate('inbox');return}
  if(a==='back'){state.detail=null;render();return}
  if(a==='columns'){state.popover=state.popover==='columns'?null:'columns';render();return}
  if(a==='clear-selection'){state.selected.clear();render();return}
  if(a==='clear-filters'||a==='clear-search'){state.query='';state.cursor=0;if(a==='clear-filters')state.filter='all';render();return}
  if(a==='next'||a==='prev'){state.cursor+=a==='next'?1:-1;render();return}
  if(a==='profile'){const menu=root.querySelector('.hf-profile-menu');menu.hidden=!menu.hidden;root.querySelector('.hf-profile').setAttribute('aria-expanded',String(!menu.hidden));return}
  if(a==='signout'){state.signedOut=true;state.draft={label:'',repository:'',demo:'',includeDemo:true,note:''};state.acceptedRevision=0;state.draftRevision=0;state.selected.clear();closeFlow();render();return}
  if(a==='signin'){state.signedOut=false;render();return}
  if(a==='recover'||a==='invite'){openFlow(a,el.dataset.id||state.detail);return}
  if(a==='review-primary'){state.filter='attention';state.cursor=0;state.detail=null;render();return}
  if(a==='review-selected'){openFlow('selection');state.flow.title='Review selected teams';state.flow.body=`<p>${state.selected.size} teams selected. Review each proposed change before confirming.</p><ul class="hf-file-list">${teams.filter(t=>state.selected.has(t.id)).map(t=>`<li>${icon('users-round')}<div><strong>${t.name}</strong><small>${esc(t.issue)}</small></div><button type="button" class="hf-button hf-button-ghost" data-modal-page="${t.id}">Review ${icon('arrow-right')}</button></li>`).join('')}</ul>`;renderFlow();return}
  if(a==='activity'){state.tab='activity';render();return}
  if(a==='access-status'){openInfo('Access still needs reconciliation','Current provider evidence has not resolved the uncertain invitation. A second approval remains blocked.');return}
  if(a==='restart'){responseEpoch++;teams.splice(0,teams.length,...JSON.parse(originalTeams));state.activity=[];state.draft={label:'Working prototype',repository:'https://github.com/northstar/team-kestrel',demo:'',includeDemo:true,note:''};state.draftRevision=0;state.acceptedRevision=0;state.unknown=null;state.busy=false;state.signedOut=false;state.page=state.portal==='admin'?'teams':'today';state.detail=state.concept==='review'?'atlas':null;state.query='';state.filter=state.concept==='queue'?'attention':'all';state.cursor=0;state.selected.clear();closeFlow();render();root.querySelector('.hf-toast').hidden=true;return}
  if(a==='open-draft'||a==='open-submit'){if(state.phase==='registration'){openInfo('No published team yet','Complete the current application and wait for explicitly published allocation.');return}if(state.phase==='closed'){if(state.acceptedRevision)openFlow('accepted');else openInfo('No accepted submission','The cutoff passed without an accepted team submission. A saved draft is not an accepted entry.');return}openFlow(a==='open-draft'?'draft':'submit');return}
  if(a==='flow-next'){if(['draft','submit'].includes(state.flow.kind)&&!validateAll())return;state.flow.step=1;renderFlow();modal.querySelector('[data-action=flow-confirm]')?.focus();return}
  if(a==='flow-back'){state.flow.step=0;renderFlow();return}
  if(a==='flow-confirm'){confirm();return}
  if(a==='check-current'){const pending=state.unknown;if(pending&&['draft','submit'].includes(pending.kind))finish(pending);else{state.unknown=null;closeFlow();render();notice('Provider result remains unresolved. Review is still required.','error')}return}
  if(['command','export','account','help','accepted'].includes(a)){openFlow(a);return}
  if(a==='download'){const csv='Team,Members,Repository,Access\n'+filtered().map(t=>[t.name,t.members,t.repo,t.access].map(x=>'"'+String(x).replaceAll('"','""')+'"').join(',')).join('\n');state.flow.title='Team export preview';state.flow.kind='information';state.flow.body=`<p>Current filtered scope · synthetic data</p><pre style="white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px">${esc(csv)}</pre>`;renderFlow();return}
  if(a==='brief'&&state.phase==='registration')return;
  const information={brief:['Challenge brief','The actually released challenge appears in a focused document reader, with the current common rubric and official clarifications nearby.'],rubric:['Common rubric','Read the published criteria and version before preparing your evidence. Private assessments remain separate.'],handbook:['Event handbook','Live start: 20 June, 09:00. Cutoff: 21 June, 17:00. Times use Europe/London.'],clarification:['Official clarification','Only the reviewed common answer appears here. The private team question and attachments stay private.'],support:['Logistics request','Team Kestrel · venue setup. Current assignee: unassigned.'],application:['Review application','Rowan Blake applied as a mentor. Facilitator selection does not reserve a competitor place.'],allocation:['Review allocation','Review, explicitly publish, then freeze the intended teams before releasing the challenge.'],readiness:['Event readiness',state.phase==='registration'?'24 confirmed competitors / minimum30. The go gate is blocked.':'The go decision is recorded; team allocation is frozen and the common challenge is released.'],schedule:['Event schedule','Challenge release13 June09:00; live start20 June09:00; submission cutoff21 June17:00.']};
  if(information[a])openInfo(...information[a]);
 });
 function openInfo(title,text){openFlow('information');state.flow.title=title;state.flow.body=`<p>${esc(text)}</p>`;renderFlow()}
 root.addEventListener('keydown',e=>{if(e.key==='Escape'){if(!backdrop.hidden)closeFlow();else{state.popover=null;root.querySelector('.hf-profile-menu').hidden=true;render()}}if((e.key==='/'||((e.metaKey||e.ctrlKey)&&e.key==='k'))&&!['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName)){e.preventDefault();openFlow('command')}if(e.key==='Tab'&&!backdrop.hidden&&modal.getAttribute('role')==='dialog'){const nodes=[...modal.querySelectorAll('button:not(:disabled),input:not(:disabled),textarea:not(:disabled),select:not(:disabled),a[href]')].filter(n=>!n.hidden&&n.getClientRects().length);if(nodes.length){const first=nodes[0],last=nodes.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}}});
 // The discussion host does not permit form navigation. Keep Enter local and
 // use the same validation/review boundary as the visible action and form event.
 root.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches('input[data-field]')&&state.flow&&state.flow.step===0&&['draft','submit'].includes(state.flow.kind)&&!state.busy){e.preventDefault();if(validateAll()){state.flow.step=1;renderFlow();modal.querySelector('[data-action=flow-confirm]')?.focus()}}});
 window.addEventListener('resize',()=>{if(state.concept==='review'&&state.detail&&!state.flow)render()});
 render();

})();
